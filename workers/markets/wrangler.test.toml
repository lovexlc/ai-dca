name = "ai-dca-markets-test"
main = "src/index.js"
workers_dev = false
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

# Fully isolated test stack: separate KV + R2 from production.
# Light crons only (after-close kline batch). No per-minute quote warmup.

[[routes]]
pattern = "test.freebacktrack.tech/api/markets/*"
zone_name = "freebacktrack.tech"

[ai]
binding = "AI"

[vars]
# ocr-proxy public host for scheduled limit cache → D1 (GET /api/fund-limit only)
FUND_LIMIT_API_BASE = "https://test.freebacktrack.tech"
MARKETS_ENV = "test"
# OTC list/quote read path: D1 full rows (nav + limit); cron still owns writes.
OTC_READ_FROM_D1 = "1"
# HTTP endpoint is retained for local/manual fallback; deployed test alerts use
# the private NOTIFY Service Binding below.
MARKETS_ADMIN_NOTIFY_ENDPOINT = "https://test.freebacktrack.tech/api/notify/admin/alert"
CHAT_MODEL_FAST = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CHAT_MODEL_DEEP = "@cf/qwen/qwq-32b"
CHAT_MAX_TOKENS = "2048"
TAVILY_ENDPOINT = "https://api.tavily.com/search"
FINNHUB_BASE = "https://finnhub.io/api/v1"
MARKETS_DATA_READ_MODE = "cache-first"

# Test schedule: CN after-close kline batch plus OTC fund sync.
[triggers]
crons = [
  "30 7 * * MON-FRI",   # CN after-close kline batch → test R2
  "30 11 * * MON-FRI",  # OTC fund sync: Beijing 19:30
  "30 12 * * MON-FRI",  # OTC fund sync: Beijing 20:30
  "30 13 * * MON-FRI"   # OTC fund sync: Beijing 21:30
]



# Markets list / OTC SQL store (D1 test).
[[d1_databases]]
binding = "DB"
database_name = "ai-dca-markets-db-test"
database_id = "3fd985d6-2905-48ee-9a0f-525a0ce1aa3f"

[[kv_namespaces]]
binding = "MARKETS_KV"
id = "05875f31d61c42d187e9921170579fa2"

[[kv_namespaces]]
binding = "NAV_HISTORY_KV"
id = "f57be616712143108cb05799f30d1bc6"

[[r2_buckets]]
binding = "MARKETS_R2"
bucket_name = "ai-dca-markets-test"

[[services]]
binding = "NOTIFY"
service = "ai-dca-notify-test"

[[services]]
binding = "OCR"
service = "ai-dca-ocr-proxy-test"
