name = "ai-dca-sync-test"
main = "src/index.js"
workers_dev = false
compatibility_date = "2026-03-30"
compatibility_flags = ["nodejs_compat"]

[vars]
# V2 is intentionally enabled only by the isolated test Worker config.
SYNC_V2_ENABLED = "true"

[[routes]]
pattern = "test.freebacktrack.tech/api/sync/*"
zone_name = "freebacktrack.tech"

# Isolated D1 + backup KV (schema created at runtime by sync worker).
[[d1_databases]]
binding = "DB"
database_name = "ai-dca-sync-db-test"
database_id = "da62dd9c-868c-479e-86f0-cf3fbe8d421f"

[[d1_databases]]
binding = "MARKETS_DB"
database_name = "ai-dca-markets-db-test"
database_id = "3fd985d6-2905-48ee-9a0f-525a0ce1aa3f"

[placement]
mode = "smart"

[triggers]
crons = ["15 0 * * *"]
