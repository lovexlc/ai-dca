name = "ai-dca-sync"
main = "src/index.js"
compatibility_date = "2026-03-30"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "api.freebacktrack.tech/api/sync/*"
zone_name = "freebacktrack.tech"

# TODO: create Cloudflare D1 database, then fill real IDs.
# Suggested names:
#   D1: ai-dca-sync-db
[[d1_databases]]
binding = "DB"
database_name = "ai-dca-sync-db"
database_id = "b0e5feab-dbcf-4ba7-9f3f-2e5169e8d868"

# Admin fund repair endpoints query the markets D1 directly. This is a second
# binding to the same database, not a copy of the market snapshot.
[[d1_databases]]
binding = "MARKETS_DB"
database_name = "ai-dca-markets-db"
database_id = "4ebb1510-d82f-4357-b6a3-414af8e41cc6"

[placement]
mode = "smart"

[triggers]
crons = ["15 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
