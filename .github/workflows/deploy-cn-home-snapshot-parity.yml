name: Deploy CN home snapshot parity

on:
  push:
    branches:
      - cn
    paths:
      - ".github/workflows/deploy-cn-home-snapshot-parity.yml"

permissions:
  contents: read

concurrency:
  group: cn-home-snapshot-parity
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lovexlc/fund_collector
          ref: cn
          path: fund_collector
      - name: Test collector
        working-directory: fund_collector
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Package collector
        run: tar -C fund_collector -czf /tmp/fund-collector-cn.tgz market_collector requirements.txt
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H rdfo1495558.bohrium.tech >> ~/.ssh/known_hosts
      - name: Upload collector
        run: scp -O /tmp/fund-collector-cn.tgz root@rdfo1495558.bohrium.tech:/tmp/fund-collector-cn.tgz
      - name: Deploy, backfill local snapshot and verify
        run: |
          ssh root@rdfo1495558.bohrium.tech bash -s <<'REMOTE'
          set -euo pipefail
          target=/root/ai-dca/services/market-collector
          staging=/tmp/fund-collector-cn
          supervisor_config="$target/deploy/supervisor.conf"
          rm -rf "$staging"
          install -d "$staging"
          tar -xzf /tmp/fund-collector-cn.tgz -C "$staging"
          rm -rf "$target/market_collector"
          cp -a "$staging/market_collector" "$target/market_collector"
          cp "$staging/requirements.txt" "$target/requirements.txt"
          install -d "$target/data/shadow"
          curl --retry 4 --retry-delay 2 --retry-all-errors -fsS --max-time 45 \
            "https://api.freebacktrack.tech/api/fund-limit/overview?days=30" \
            -o "$target/data/shadow/fund-limit-overview.json.tmp"
          python3 - <<'PY'
          import json, os
          base='/root/ai-dca/services/market-collector/data/shadow'
          src=base+'/fund-limit-overview.json.tmp'
          dst=base+'/fund-limit-overview.json'
          payload=json.load(open(src))
          assert isinstance(payload.get('records'), list) and payload['records']
          assert isinstance((payload.get('summary') or {}).get('totalByCurrency'), dict)
          os.replace(src,dst)
          PY
          supervisorctl -c "$supervisor_config" restart market-collector market-collector-api
          sleep 5
          supervisorctl -c "$supervisor_config" status market-collector market-collector-api
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            --resolve cn.freebacktrack.tech:5000:127.0.0.1 \
            https://cn.freebacktrack.tech:5000/api/market-collector/aggregates/home-market-overview \
            >/tmp/home-overview.json
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsS --max-time 30 \
            --resolve cn.freebacktrack.tech:5000:127.0.0.1 \
            https://cn.freebacktrack.tech:5000/api/market-collector/aggregates/fund-limit-overview \
            >/tmp/fund-limit.json
          python3 - <<'PY'
          import json
          home=json.load(open('/tmp/home-overview.json'))
          limits=json.load(open('/tmp/fund-limit.json'))
          b=home['breadth']
          breadth_total=b.get('riseCount',0)+b.get('fallCount',0)+b.get('flatCount',0)
          assert breadth_total <= 21, breadth_total
          currencies=[x.get('currency') for x in limits.get('currencyTotals') or []]
          assert 'CNY' in currencies and 'USD' in currencies, currencies
          assert limits.get('records'), 'records empty'
          print({'breadth': b, 'currencies': currencies, 'records': len(limits['records']), 'events': len(limits.get('events') or [])})
          PY
          rm -rf "$staging" /tmp/fund-collector-cn.tgz
          REMOTE
