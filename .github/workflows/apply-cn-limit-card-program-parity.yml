name: Apply CN quota card parity

on:
  push:
    branches:
      - "fix/cn-limit-card-program-parity"
    paths:
      - ".github/workflows/apply-cn-limit-card-program-parity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/cn-limit-card-program-parity"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python3 scripts/apply_cn_limit_card_program_parity.py
      - run: npm ci
      - run: |
          npm run check:refactor
          npm run build:app
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CnHomeExperience.jsx src/pages/cn-home.css
          git commit -m "fix: align CN quota card with Mini Program"
          git rm scripts/apply_cn_limit_card_program_parity.py .github/workflows/apply-cn-limit-card-program-parity.yml
          git commit -m "chore: remove temporary quota card patch files"
          git push
