name: Deploy test workers

on:
  push:
    branches:
      - test
    paths:
      - 'workers/**'
      - 'test/fundReport*.test.mjs'
      - 'scripts/check_nav_access.mjs'
      - '.github/workflows/deploy-test-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check NAV access boundaries
        run: node scripts/check_nav_access.mjs

      - name: Check test env isolation (no shared prod storage)
        run: node scripts/check_test_env_isolation.mjs

      - name: Run fund report demo tests
        run: node --test test/fundReportParser.test.mjs test/fundReportSync.test.mjs test/fundReportRoute.test.mjs

      - name: Apply test markets D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: d1 migrations apply ai-dca-markets-db-test --remote --config workers/markets/wrangler.test.toml

      - name: Deploy test markets worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/markets/wrangler.test.toml

      - name: Configure test Xueqiu cookie
        env:
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$XUEQIU_COOKIE" ]; then
            echo "XUEQIU_COOKIE is not configured; leaving the test Worker secret unchanged"
            exit 0
          fi
          printf '%s' "$XUEQIU_COOKIE" | npx wrangler@3 secret put XUEQIU_COOKIE --config workers/markets/wrangler.test.toml

      - name: Deploy test OCR worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/ocr-proxy/wrangler.test.toml

      - name: Deploy test sync worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/sync/wrangler.test.toml

      - name: Deploy test notify worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/notify/wrangler.test.toml

      - name: Verify test worker routes
        run: |
          set -euo pipefail
          markets_health=$(curl -fsS --max-time 20 https://test.freebacktrack.tech/api/markets/health)
          notify_health=$(curl -fsS --max-time 20 https://test.freebacktrack.tech/api/notify/health)
          sync_health=$(curl -fsS --max-time 20 https://test.freebacktrack.tech/api/sync/health)
          ocr_health=$(curl -fsS --max-time 20 https://test.freebacktrack.tech/api/health)
          printf '%s\n' "$markets_health" | jq -e '.ok == true and .name == "ai-dca-markets"'
          printf '%s\n' "$notify_health" | jq -e '.ok == true'
          printf '%s\n' "$sync_health" | jq -e '.ok == true and .service == "sync"'
          printf '%s\n' "$ocr_health" | jq -e '.ok == true'

      - name: Verify fund report demo end to end
        shell: bash
        run: |
          set -uo pipefail

          probe() {
            local name="$1"
            local url="$2"
            local body
            local status
            body=$(mktemp)
            status=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' "$url" || true)
            echo "===== $name =====" >&2
            echo "HTTP $status" >&2
            cat "$body" >&2
            echo >&2
            printf '%s|%s' "$status" "$body"
          }

          meta_probe=$(probe meta 'https://test.freebacktrack.tech/api/fund-report?code=270042&meta=1')
          meta_status=${meta_probe%%|*}
          meta_body=${meta_probe#*|}

          ocr_probe=$(probe ocr_full 'https://test.freebacktrack.tech/api/fund-report?code=270042&force=1')
          ocr_status=${ocr_probe%%|*}
          ocr_body=${ocr_probe#*|}

          markets_probe=$(probe markets_force 'https://test.freebacktrack.tech/api/markets/fund-report?code=270042&force=1')
          markets_status=${markets_probe%%|*}
          markets_body=${markets_probe#*|}

          read_probe=$(probe markets_read 'https://test.freebacktrack.tech/api/markets/fund-report?code=270042')
          read_status=${read_probe%%|*}
          read_body=${read_probe#*|}

          if [ "$meta_status" != "200" ]; then exit 1; fi
          if [ "$ocr_status" != "200" ]; then exit 1; fi
          if [ "$markets_status" != "200" ]; then exit 1; fi
          if [ "$read_status" != "200" ]; then exit 1; fi

          report=$(cat "$markets_body")
          printf '%s\n' "$report" | jq -e '.code == "270042" and .latest != null and .latest.reportPeriod != null and .latest.benchmark != null and .latest.period3m.fundReturn != null and .latest.period3m.benchmarkReturn != null and .latest.period3m.trackingDifference != null and .latest.period1y.fundReturn != null and .latest.period1y.benchmarkReturn != null and .latest.period1y.trackingDifference != null'
          printf '%s\n' "$report" | jq '{code, latest: {artCode: .latest.artCode, reportPeriod: .latest.reportPeriod, benchmark: .latest.benchmark, period3m: .latest.period3m, period1y: .latest.period1y, parser: .latest.parser}}'

          rm -f "$meta_body" "$ocr_body" "$markets_body" "$read_body"
