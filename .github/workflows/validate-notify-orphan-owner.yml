name: Validate notify orphan channel owner fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-notify-orphan-channel-owner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply fix patch
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/notifyfix.patch
          git apply --check /tmp/notifyfix.patch
          git apply /tmp/notifyfix.patch
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run notify regression tests
        run: node --test test/notifyAccountOwnership.test.mjs test/notifyRowStorage.test.mjs test/emailNotification.test.mjs test/notifySettingsRoute.test.mjs test/notifyDeliveryTargetChannels.test.mjs
      - name: Check refactor guard
        run: npm run check:refactor
      - name: Build frontend
        run: npm run build:app
      - name: Notify worker dry run
        run: npx wrangler deploy --dry-run --config workers/notify/wrangler.toml
      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/notify/src/notifyClientRoutes.js workers/notify/src/notifyStorage.js workers/notify/src/notifyRowStorage.js workers/notify/src/emailRoutes.js test/notifyAccountOwnership.test.mjs test/notifyRowStorage.test.mjs test/emailNotification.test.mjs
          git commit -m 'fix(notify): reconcile stale channel ownership' || exit 0
          git push origin HEAD:fix/cn-notify-orphan-channel-owner