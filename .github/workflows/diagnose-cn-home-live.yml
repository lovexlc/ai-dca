name: Complete CN collector restore

on:
  push:
    branches:
      - diagnose/cn-home-live-20260908
    paths:
      - .github/workflows/diagnose-cn-home-live.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H rdfo1495558.bohrium.tech >> ~/.ssh/known_hosts
      - name: Complete restore and restart services
        run: |
          ssh root@rdfo1495558.bohrium.tech bash -s <<'REMOTE'
          set -euo pipefail
          expected=3c6bca61e39d7260f3bdf1a1a84b5409980152e8
          canonical=/root/market-collector-canonical
          new=/root/market-collector-canonical.new
          prod=/root/ai-dca/services/market-collector
          guard=/root/market-collector-deploy/guard.py
          sup=/etc/market-collector-supervisord.conf
          git config --global --add safe.directory "$new"
          test "$(git -C "$new" rev-parse HEAD)" = "$expected"
          rm -rf /root/market-collector-canonical.old
          mv "$canonical" /root/market-collector-canonical.old
          mv "$new" "$canonical"
          git config --global --add safe.directory "$canonical"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/root/market-collector-deploy/guard.py')
          s=p.read_text().replace('["git", "fetch", "origin", "main"]','["git", "fetch", "origin", "cn"]')
          p.write_text(s)
          PY
          grep -Fq '["git", "fetch", "origin", "cn"]' "$guard"
          rm -rf "$prod/market_collector" "$prod/tests"
          cp -a "$canonical/market_collector" "$prod/market_collector"
          cp -a "$canonical/tests" "$prod/tests"
          cp "$canonical/requirements.txt" "$prod/requirements.txt"
          grep -q HOME_BREADTH_SYMBOLS "$prod/market_collector/aggregates.py"
          supervisorctl -c "$sup" start market-collector market-collector-api market-collector-guard
          sleep 12
          verify() {
            test "$(git -C "$canonical" rev-parse HEAD)" = "$expected"
            grep -q HOME_BREADTH_SYMBOLS "$prod/market_collector/aggregates.py"
            curl --noproxy '*' --retry 10 --retry-delay 2 --retry-all-errors -fsS --max-time 30 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/api/market-collector/aggregates/home-market-overview >/tmp/verify-home.json
            curl --noproxy '*' --retry 10 --retry-delay 2 --retry-all-errors -fsS --max-time 30 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/api/market-collector/aggregates/fund-limit-overview >/tmp/verify-limits.json
            python3 - <<'PY'
          import json
          h=json.load(open('/tmp/verify-home.json')); l=json.load(open('/tmp/verify-limits.json'))
          b=h['breadth']; total=sum(b.get(k,0) for k in ['riseCount','fallCount','flatCount'])
          currencies=[x.get('currency') for x in l.get('currencyTotals') or []]
          assert total <= 21, (total,b)
          assert 'CNY' in currencies and 'USD' in currencies, currencies
          assert l.get('records'), 'records empty'
          assert l.get('source') == 'market-collector-local-snapshot', l.get('source')
          print({'breadth':b,'currencies':currencies,'records':len(l['records']),'events':len(l.get('events') or []),'source':l.get('source')})
          PY
          }
          verify
          sleep 70
          verify
          supervisorctl -c "$sup" status market-collector market-collector-api market-collector-guard
          REMOTE
