name: Trace CN collector overwrite

on:
  push:
    branches:
      - diagnose/cn-home-live-20260908
    paths:
      - .github/workflows/diagnose-cn-home-live.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/cn-home-live-20260908
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H rdfo1495558.bohrium.tech >> ~/.ssh/known_hosts
      - name: Trace overwrite source
        run: |
          mkdir -p diagnostics
          ssh root@rdfo1495558.bohrium.tech bash -s > diagnostics/cn-overwrite-trace.txt 2>&1 <<'REMOTE'
          set +e
          target=/root/ai-dca/services/market-collector
          echo '=== target/stat/hash ==='
          date -Ins
          ls -ld /root/ai-dca "$target" "$target/market_collector"
          stat "$target/market_collector/aggregates.py"
          sha256sum "$target/market_collector/aggregates.py"
          grep -n 'HOME_BREADTH_SYMBOLS\|fund-limit-overview.json' "$target/market_collector/aggregates.py" | head
          echo '=== git roots ==='
          git -C /root/ai-dca status --short --branch 2>&1 | head -80
          git -C /root/ai-dca log -1 --oneline 2>&1
          echo '=== duplicate aggregates ==='
          find /root /opt /srv /var/www -type f -path '*/market_collector/aggregates.py' -print -exec sha256sum {} \; 2>/dev/null | head -120
          echo '=== cron ==='
          crontab -l 2>&1
          for f in /etc/crontab /etc/cron.d/* /var/spool/cron/crontabs/*; do echo ---$f; cat "$f" 2>/dev/null; done
          echo '=== timers ==='
          systemctl list-timers --all --no-pager
          echo '=== services references ==='
          grep -RniE 'ai-dca|market-collector|git pull|rsync|copytree' /etc/systemd/system /usr/lib/systemd/system /etc/cron* /root/.config/systemd 2>/dev/null | head -240
          echo '=== running processes ==='
          ps -eo pid,ppid,lstart,cmd --forest | grep -E 'ai-dca|market.collector|supervisor|deploy|git|rsync' | grep -v grep
          echo '=== recent logs ==='
          tail -n 120 /var/log/supervisor/market-collector.log
          tail -n 120 /var/log/supervisor/market-collector.err.log
          tail -n 120 /var/log/supervisor/market-collector-api.err.log
          REMOTE
      - name: Save trace
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f diagnostics/cn-overwrite-trace.txt
          git commit -m 'chore: save collector overwrite trace'
          git push
