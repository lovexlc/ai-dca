name: Inspect CN collector guard

on:
  push:
    branches:
      - diagnose/cn-home-live-20260908
    paths:
      - .github/workflows/diagnose-cn-home-live.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/cn-home-live-20260908
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H rdfo1495558.bohrium.tech >> ~/.ssh/known_hosts
      - name: Inspect guard
        run: |
          mkdir -p diagnostics
          ssh root@rdfo1495558.bohrium.tech bash -s > diagnostics/cn-guard.txt 2>&1 <<'REMOTE'
          echo '=== supervisor ==='
          cat /etc/market-collector-supervisord.conf
          echo '=== guard ==='
          sed -n '1,260p' /root/market-collector-deploy/guard.py
          echo '=== canonical tree ==='
          find /root/market-collector-canonical -maxdepth 2 -type f -printf '%p %TY-%Tm-%Td %TH:%TM:%TS\n' | sort | head -120
          echo '=== canonical metadata ==='
          find /root/market-collector-deploy -maxdepth 2 -type f -printf '%p %TY-%Tm-%Td %TH:%TM:%TS\n' | sort | head -160
          REMOTE
      - name: Save guard details
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f diagnostics/cn-guard.txt
          git commit -m 'chore: save collector guard details'
          git push
