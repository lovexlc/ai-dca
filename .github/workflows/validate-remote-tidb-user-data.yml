name: Validate remote TiDB user-data changes

on:
  pull_request:
    branches: [main, cn]
    paths:
      - 'src/**'
      - 'workers/user-data/**'
      - 'docs/remote-tidb-user-data.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-remote-tidb-user-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: guard
            command: npm run check:refactor
          - name: lint
            command: npm run lint
          - name: build
            command: npm run build:app
          - name: worker-test
            command: node --test workers/user-data/test/user-data.test.mjs
          - name: whitespace
            command: git diff --check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: matrix.name != 'whitespace'
        run: npm ci
      - name: Run check
        if: matrix.name != 'worker-test' || hashFiles('workers/user-data/test/user-data.test.mjs') != ''
        run: ${{ matrix.command }}
        env:
          VITE_POSTHOG_API_KEY: phc_placeholder
          VITE_POSTHOG_HOST: https://us.i.posthog.com
