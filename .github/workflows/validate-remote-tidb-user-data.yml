name: Validate remote TiDB user-data changes

on:
  pull_request:
    branches: [main, cn]
    paths:
      - 'src/**'
      - 'workers/user-data/**'
      - 'docs/remote-tidb-user-data.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-remote-tidb-user-data.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: validate-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: guard
            command: npm run check:refactor
          - name: lint
            command: npm run lint
          - name: build
            command: npm run build:app
          - name: worker-test
            command: node --test workers/user-data/test/user-data.test.mjs
          - name: whitespace
            command: git diff --check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: matrix.name != 'whitespace'
        run: npm ci
      - name: Run check
        if: matrix.name != 'worker-test' || hashFiles('workers/user-data/test/user-data.test.mjs') != ''
        run: ${{ matrix.command }}
        env:
          VITE_POSTHOG_API_KEY: phc_placeholder
          VITE_POSTHOG_HOST: https://us.i.posthog.com

  lint-files:
    name: lint-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-client
            file: src/app/authClient.js
          - name: auth-session
            file: src/app/authSession.js
          - name: region-environment
            file: src/app/regionEnvironment.js
          - name: remote-storage
            file: src/app/remoteStorage.js
          - name: remote-user-data
            file: src/app/remoteUserData.js
          - name: region-banner
            file: src/components/region-switch-banner.jsx
          - name: entry-screen
            file: src/entry-screen.jsx
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed file
        run: npx eslint ${{ matrix.file }}

  lint-report:
    name: lint-report
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture full lint output
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat lint-output.txt
          exit 0
      - name: Publish lint output to PR
        if: steps.lint.outputs.status != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8');
            const body = [
              '<!-- cn-lint-diagnostic -->',
              `CN lint diagnostic (exit ${process.env.LINT_STATUS})`,
              '',
              '```text',
              output.slice(-60000),
              '```'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Fail if lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
