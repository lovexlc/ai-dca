name: Deploy geo worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/geo/**'
      - '.github/workflows/deploy-worker-geo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-geo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy geo worker via Wrangler
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/geo/wrangler.toml

      - name: Verify geo endpoint
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS --max-time 20 \
            https://api.freebacktrack.tech/api/geo
          echo

      - name: Print deployment summary
        if: always()
        run: |
          echo "### geo worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: ${GITHUB_WORKFLOW}" >> "$GITHUB_STEP_SUMMARY"
