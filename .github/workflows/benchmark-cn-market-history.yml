name: Benchmark CN market history sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root

    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Benchmark maximum history rows
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CN_USER@$CN_HOST" python3 -u - <<'PY'
          from __future__ import annotations

          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          SYMBOL = "513100"
          MARKET_SYMBOL = "sh513100"
          TIMEOUT = 25.0
          TARGET_LIMIT = 10000
          PERIODS = {
              "5m": {"eastmoney": 5, "tencent": "m5", "sina": 5, "danjuan": "5m"},
              "15m": {"eastmoney": 15, "tencent": "m15", "sina": 15, "danjuan": "15m"},
              "30m": {"eastmoney": 30, "tencent": "m30", "sina": 30, "danjuan": "30m"},
              "60m": {"eastmoney": 60, "tencent": "m60", "sina": 60, "danjuan": "60m"},
              "1d": {"eastmoney": 101, "tencent": "day", "sina": 240, "danjuan": "day"},
          }


          def fetch_text(url: str, referer: str) -> tuple[str, float, int]:
              request = urllib.request.Request(url, headers={
                  "accept": "application/json,text/plain,*/*",
                  "referer": referer,
                  "user-agent": "Mozilla/5.0 market-history-benchmark/1",
              })
              started = time.perf_counter()
              with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                  raw = response.read()
              elapsed = (time.perf_counter() - started) * 1000
              return raw.decode("utf-8", "replace"), elapsed, len(raw)


          def result(provider: str, period: str, rows, elapsed: float, size: int, requested: int, url: str):
              dates = []
              valid_ohlc = 0
              for row in rows:
                  if isinstance(row, str):
                      fields = row.split(",")
                  elif isinstance(row, (list, tuple)):
                      fields = list(row)
                  elif isinstance(row, dict):
                      fields = [
                          row.get("day") or row.get("date") or row.get("time"),
                          row.get("open") or row.get("o"),
                          row.get("close") or row.get("c"),
                          row.get("high") or row.get("h"),
                          row.get("low") or row.get("l"),
                      ]
                  else:
                      continue
                  if fields and fields[0]:
                      dates.append(str(fields[0]))
                  if len(fields) >= 5 and all(value not in (None, "", "-") for value in fields[1:5]):
                      valid_ohlc += 1
              return {
                  "provider": provider,
                  "period": period,
                  "requested": requested,
                  "rows": len(rows),
                  "validOhlcRows": valid_ohlc,
                  "first": dates[0] if dates else "",
                  "last": dates[-1] if dates else "",
                  "elapsedMs": round(elapsed, 1),
                  "bytes": size,
                  "urlHost": urllib.parse.urlparse(url).netloc,
              }


          def eastmoney(period: str, value: int):
              params = urllib.parse.urlencode({
                  "secid": "1.513100",
                  "klt": value,
                  "fqt": 1,
                  "lmt": TARGET_LIMIT,
                  "end": 20500101,
                  "fields1": "f1,f2,f3,f4,f5,f6",
                  "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
              })
              url = "https://push2his.eastmoney.com/api/qt/stock/kline/get?" + params
              text, elapsed, size = fetch_text(url, "https://quote.eastmoney.com/")
              payload = json.loads(text)
              rows = ((payload.get("data") or {}).get("klines")) or []
              return result("eastmoney", period, rows, elapsed, size, TARGET_LIMIT, url)


          def tencent(period: str, value: str):
              if period == "1d":
                  param = f"{MARKET_SYMBOL},day,,,{TARGET_LIMIT},qfq"
                  url = "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?" + urllib.parse.urlencode({"param": param})
                  row_keys = ("qfqday", "day")
              else:
                  param = f"{MARKET_SYMBOL},{value},,{TARGET_LIMIT}"
                  url = "https://ifzq.gtimg.cn/appstock/app/kline/mkline?" + urllib.parse.urlencode({"param": param})
                  row_keys = (value,)
              text, elapsed, size = fetch_text(url, "https://gu.qq.com/")
              payload = json.loads(text)
              data = ((payload.get("data") or {}).get(MARKET_SYMBOL)) or {}
              rows = []
              for key in row_keys:
                  if data.get(key):
                      rows = data[key]
                      break
              return result("tencent", period, rows, elapsed, size, TARGET_LIMIT, url)


          def sina(period: str, value: int):
              callback = f"var _{MARKET_SYMBOL}_{value}_{TARGET_LIMIT}="
              params = urllib.parse.urlencode({
                  "symbol": MARKET_SYMBOL,
                  "scale": value,
                  "ma": "no",
                  "datalen": TARGET_LIMIT,
              })
              url = (
                  "https://quotes.sina.cn/cn/api/jsonp_v2.php/"
                  + urllib.parse.quote(callback, safe=" _=")
                  + "/CN_MarketDataService.getKLineData?"
                  + params
              )
              text, elapsed, size = fetch_text(url, "https://finance.sina.com.cn/")
              start = text.find("[")
              end = text.rfind("]")
              rows = json.loads(text[start:end + 1]) if start >= 0 and end > start else []
              return result("sina", period, rows, elapsed, size, TARGET_LIMIT, url)


          def danjuan(period: str, value: str):
              begin = int(time.time() * 1000)
              params = urllib.parse.urlencode({
                  "symbol": "SH513100",
                  "period": value,
                  "begin": begin,
                  "count": -TARGET_LIMIT,
                  "indicator": "kline",
              })
              url = "https://danjuanfunds.com/djapi/stock/candles?" + params
              text, elapsed, size = fetch_text(url, "https://danjuanfunds.com/")
              payload = json.loads(text)
              data = payload.get("data") or {}
              rows = data.get("items") or data.get("item") or payload.get("items") or []
              columns = data.get("column") or data.get("columns") or []
              normalized = []
              for row in rows:
                  if isinstance(row, dict):
                      normalized.append(row)
                      continue
                  if isinstance(row, (list, tuple)) and columns:
                      normalized.append(dict(zip(columns, row)))
                      continue
                  normalized.append(row)
              output = result("danjuan", period, normalized, elapsed, size, TARGET_LIMIT, url)
              output["columns"] = columns
              return output


          providers = (
              ("eastmoney", eastmoney),
              ("tencent", tencent),
              ("sina", sina),
              ("danjuan", danjuan),
          )
          print("HISTORY_BENCH_META " + json.dumps({
              "symbol": SYMBOL,
              "targetLimit": TARGET_LIMIT,
              "hostTime": datetime.now(ZoneInfo("Asia/Shanghai")).isoformat(),
          }, ensure_ascii=False, sort_keys=True), flush=True)
          for period, values in PERIODS.items():
              for provider, fn in providers:
                  try:
                      output = fn(period, values[provider])
                      output["ok"] = output["rows"] > 0
                  except Exception as exc:
                      output = {
                          "provider": provider,
                          "period": period,
                          "requested": TARGET_LIMIT,
                          "rows": 0,
                          "validOhlcRows": 0,
                          "ok": False,
                          "error": f"{type(exc).__name__}: {str(exc)[:300]}",
                      }
                  print("HISTORY_BENCH " + json.dumps(output, ensure_ascii=False, sort_keys=True), flush=True)
          PY
