name: Validate account migration gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cn
        uses: actions/checkout@v4
        with:
          ref: cn
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add server-side migration gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workers/account/src/index.js')
          text = path.read_text()
          old = '''async function handleMigrationStatus(request, env, user) {
            const [migration, legacy, manifest] = await Promise.all([
              readMigration(env, user.id),
              readLegacyBackupMeta(env, user.id),
              readCombinedManifest(env, user.id)
            ]);
            const migratedResources = manifest.filter((item) => item.revision > 0 && !item.deleted).map((item) => item.resource);
            const needsMigration = migration.status === 'pending' && legacy.exists && migratedResources.length === 0;
            return json(request, { ...migration, legacy, migratedResources, needsMigration });
          }
          '''
          new = '''function normalizeMigrationState(migration = {}, legacy = {}) {
            const rawStatus = String(migration?.status || 'pending').trim().toLowerCase();
            const legacyExists = Boolean(legacy?.exists);
            const status = rawStatus === 'pending' && !legacyExists ? 'no-legacy' : rawStatus;
            return {
              ...migration,
              status,
              legacy,
              needsMigration: status === 'pending' && legacyExists
            };
          }

          async function readLegacyMigrationGate(env, userId) {
            const [migration, legacy] = await Promise.all([
              readMigration(env, userId),
              readLegacyBackupMeta(env, userId)
            ]);
            return normalizeMigrationState(migration, legacy);
          }

          async function assertLegacyMigrationSettled(env, userId) {
            const migration = await readLegacyMigrationGate(env, userId);
            if (migration.status === 'imported' || migration.status === 'skipped' || migration.status === 'no-legacy') {
              return migration;
            }
            throw new HttpError(409, 'LEGACY_MIGRATION_REQUIRED', '账号旧数据尚未迁移，暂不允许访问新账号资源');
          }

          async function handleMigrationStatus(request, env, user) {
            const [migration, manifest] = await Promise.all([
              readLegacyMigrationGate(env, user.id),
              readCombinedManifest(env, user.id)
            ]);
            const migratedResources = manifest.filter((item) => item.revision > 0 && !item.deleted).map((item) => item.resource);
            return json(request, { ...migration, migratedResources });
          }
          '''
          if old not in text:
              raise SystemExit('migration status block not found')
          text = text.replace(old, new)

          old_route = '''      const user = await requireUser(request, env);

                if (route.kind === 'manifest') {
          '''
          new_route = '''      const user = await requireUser(request, env);

                // migrations/legacy 是账号资源的唯一门禁。迁移查询/导入/跳过之外，
                // manifest、bundle、资源与交易行接口都必须在服务端再次确认已 settled。
                if (route.kind !== 'migration' && route.kind !== 'migration-skip') {
                  await assertLegacyMigrationSettled(env, user.id);
                }

                if (route.kind === 'manifest') {
          '''
          if old_route not in text:
              raise SystemExit('route insertion point not found')
          text = text.replace(old_route, new_route)
          path.write_text(text)
          PY
          git diff --check

      - name: Run migration ordering tests
        run: node --test test/accountMigrationGate.test.mjs test/accountResourceSync.test.mjs test/authClient.test.mjs test/holdingsTransactionRows.test.mjs

      - name: Run account worker tests
        run: node --test workers/account/test/catalog.test.mjs workers/account/test/patch.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Build frontend
        run: npm run build

      - name: Validate account Worker bundle
        run: npx wrangler deploy --dry-run --config workers/account/wrangler.toml

      - name: Commit validated server gate
        run: |
          if git diff --quiet -- workers/account/src/index.js; then
            echo 'Server migration gate already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/account/src/index.js
          git commit -m 'fix(account): reject resource access before migration settles'
          git push origin HEAD:cn
