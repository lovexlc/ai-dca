name: Temporary CN notify UI runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CN
        uses: actions/checkout@v4
        with:
          ref: cn
          fetch-depth: 0

      - name: Apply compact notification redesign
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path('src/pages/NotifyExperience.jsx')
          s = p.read_text()
          s = s.replace("  const [rulesExpanded, setRulesExpanded] = useState(false);", "  const [rulesExpanded, setRulesExpanded] = useState(true);")
          s = s.replace("  const [historyExpanded, setHistoryExpanded] = useState(false);", "  const [historyExpanded, setHistoryExpanded] = useState(true);")
          old = '''  return (\n    <div className={cx('mx-auto max-w-7xl space-y-6', embedded ? 'px-4 sm:px-6' : 'px-6')}>\n      <div className="space-y-6">\n        {renderConfigCard()}'''
          new = '''  return (\n    <div className={cx('mx-auto max-w-7xl space-y-5', embedded ? 'px-4 sm:px-6' : 'px-6')}><header className="flex flex-col gap-2 pt-1 sm:flex-row sm:items-center sm:justify-between"><div><div className="flex flex-wrap items-center gap-3"><h1 className="text-2xl font-bold tracking-tight text-slate-950 sm:text-[28px]">通知管理</h1><span className="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700"><span className="h-1.5 w-1.5 rounded-full bg-emerald-500" />运行正常</span></div><p className="mt-1.5 text-sm text-slate-500">在这里管理通知渠道、提醒规则与最近送达记录。</p></div></header>\n      <div className="space-y-5">\n        {renderConfigCard()}'''
          if old not in s:
              raise SystemExit('NotifyExperience layout anchor not found')
          s = s.replace(old, new)
          if len(s.splitlines()) > 880:
              raise SystemExit(f'NotifyExperience line budget exceeded: {len(s.splitlines())}')
          p.write_text(s)

          p = Path('src/pages/NotifyConfigCard.jsx')
          s = p.read_text()
          start = s.index('      <div className="bg-gradient-to-br')
          end = s.index('\n\n      <div className="grid gap-3 border-b', start)
          newblock = '''      <div className="flex flex-col gap-3 border-b border-slate-100 px-5 py-5 sm:flex-row sm:items-center sm:justify-between sm:px-6">\n        <div>\n          <h2 className="text-lg font-bold text-slate-950">通知渠道</h2>\n          <p className="mt-1 text-sm text-slate-500">选择并管理你希望接收通知的渠道，支持多平台同时接收。</p>\n        </div>\n        <div className="flex items-center gap-2 text-xs text-slate-500">\n          <span className={cx('h-2 w-2 rounded-full', hasAnyChannel ? 'bg-emerald-500' : 'bg-slate-300')} />\n          <span>{connectedChannelCount} / {channelCards.length} 个渠道已连接</span>\n        </div>\n      </div>'''
          s = s[:start] + newblock + s[end:]
          s = s.replace('grid gap-3 border-b border-slate-100 bg-slate-50/70 p-4 sm:grid-cols-2 sm:p-5 xl:grid-cols-4', 'grid gap-3 p-4 sm:grid-cols-2 sm:p-5 xl:grid-cols-4')
          s = s.replace("'group flex min-w-0 items-center gap-3 rounded-2xl border px-3.5 py-3 text-left transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300'", "'group flex min-w-0 items-center gap-3 rounded-xl border px-4 py-4 text-left transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300'")
          s = s.replace("? 'border-indigo-300 bg-white shadow-sm ring-1 ring-indigo-100'", "? 'border-indigo-300 bg-indigo-50/30 shadow-sm'")
          s = s.replace(": 'border-slate-200 bg-white/80 hover:border-indigo-200 hover:bg-white'", ": 'border-slate-200 bg-white hover:border-indigo-200'")
          s = s.replace('rounded-2xl bg-indigo-50 text-indigo-600', 'rounded-xl bg-indigo-50 text-indigo-600')
          s = s.replace('rounded-2xl border border-rose-200', 'rounded-xl border border-rose-200')
          s = s.replace('rounded-2xl border border-emerald-200', 'rounded-xl border border-emerald-200')
          p.write_text(s)

          p = Path('src/pages/NotifyRulesCard.jsx')
          s = p.read_text()
          s = s.replace('className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_1px_3px_rgba(15,23,42,0.06)]"', 'className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.04)]"')
          s = s.replace('className="flex min-w-0 flex-1 items-center justify-between gap-4 px-5 py-5 text-left transition-colors hover:bg-slate-50 sm:px-6"', 'className="flex min-w-0 flex-1 items-center justify-between gap-4 px-5 py-4 text-left transition-colors hover:bg-slate-50 sm:px-6"')
          s = s.replace('rounded-2xl bg-indigo-50 text-indigo-600', 'rounded-xl bg-indigo-50 text-indigo-600')
          s = s.replace('space-y-5 border-t border-slate-100 bg-slate-50/40 px-4 py-5 sm:px-6 sm:py-6', 'space-y-4 border-t border-slate-100 bg-white px-4 py-4 sm:px-6 sm:py-5')
          metric = '''          <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">\n            <RuleMetric icon={Bell} label="价格预警" value={`${enabledPriceAlertCount}/${priceAlertCount}`} note="已启用" tone="amber" />\n            <RuleMetric icon={Calendar} label="计划与定投" value={`${enabledTradePlanCount + enabledDcaCount}/${tradePlanCount + dcaCount}`} note="已启用" tone="indigo" />\n            <RuleMetric icon={Shuffle} label="切换信号" value={`${enabledSwitchRuleCount}/${switchRuleCount}`} note="已启用" tone="cyan" />\n            <RuleMetric icon={Wallet} label="每日收益" value={holdingsEnabled ? '运行中' : '已关闭'} tone="emerald" />\n          </div>\n\n'''
          s = s.replace(metric, '')
          p.write_text(s)

          p = Path('src/pages/NotifyHistoryCard.jsx')
          s = p.read_text()
          s = s.replace('className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-[0_1px_3px_rgba(15,23,42,0.06)]"', 'className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.04)]"')
          s = s.replace('className="flex w-full min-w-0 items-center justify-between gap-4 px-5 py-5 text-left transition-colors hover:bg-slate-50 sm:px-6"', 'className="flex w-full min-w-0 items-center justify-between gap-4 px-5 py-4 text-left transition-colors hover:bg-slate-50 sm:px-6"')
          s = s.replace('rounded-2xl bg-slate-100 text-slate-600', 'rounded-xl bg-slate-100 text-slate-600')
          s = s.replace('border-t border-slate-100 bg-slate-50/40 px-4 py-5 sm:px-6', 'border-t border-slate-100 bg-white px-4 py-4 sm:px-6')
          p.write_text(s)
          PY

          grep -q '运行正常' src/pages/NotifyExperience.jsx
          grep -q '通知渠道' src/pages/NotifyConfigCard.jsx
          ! grep -q 'bg-gradient-to-br from-slate-950' src/pages/NotifyConfigCard.jsx
          git diff --check
          git diff --stat

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit CN redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "style: redesign notification management UI"
          git push origin HEAD:cn
