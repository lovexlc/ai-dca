name: Patch beta switch plan card actions
on:
  push:
    branches: [cn]
    paths: ['.github/workflows/patch-switch-beta-card-actions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply focused UI patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/SwitchStrategyBetaExperience.jsx')
          s = p.read_text()
          s = s.replace("import { ArrowLeftRight, Check, Loader2, Play, Plus, RefreshCw, X } from 'lucide-react';", "import { ArrowLeftRight, Check, FlaskConical, Loader2, Pencil, Plus, RefreshCw, Trash2, X } from 'lucide-react';")
          start = s.index('function RuleCard(')
          end = s.index('\n\nexport function SwitchStrategyBetaExperience()', start)
          rule_card = '''function RuleCard({ rule, snapshot, busy, testing, onToggle, onEdit, onDelete, onTest }) {
            const status = useMemo(() => {
              const data = ruleSnapshot(snapshot, rule.id); const group = data?.byBenchmark?.[0]; const holding = group?.benchmarkCode || rule.benchmarkCodes?.[0]; const classes = rule.premiumClass || {}; const side = classes[holding] || group?.benchmarkClass || 'L';
              const candidate = (group?.candidates || []).filter((item) => item.valid && classes[item.code] && classes[item.code] !== side).sort((a, b) => Math.abs(num(b.spreadVsBenchmarkPct)) - Math.abs(num(a.spreadVsBenchmarkPct)))[0];
              const raw = Number(candidate?.spreadVsBenchmarkPct); const gap = Number.isFinite(raw) ? (side === 'H' ? raw : -raw) : null; const lower = num(rule.intraSellLowerPct, 1); const upper = num(rule.intraBuyOtherPct, 3); const progress = gap == null ? 0 : side === 'H' ? Math.max(0, Math.min(100, (gap - lower) / Math.max(.01, upper - lower) * 100)) : Math.max(0, Math.min(100, (upper - gap) / Math.max(.01, upper - lower) * 100));
              return { data, side, candidate, gap, progress, h: side === 'H' ? holding : candidate?.code || Object.keys(classes).find((code) => classes[code] === 'H'), l: side === 'L' ? holding : candidate?.code || Object.keys(classes).find((code) => classes[code] === 'L') };
            }, [rule, snapshot]);
            const actionClass = 'inline-flex min-h-9 items-center justify-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 text-xs font-bold text-slate-600 transition hover:border-indigo-200 hover:text-indigo-700 disabled:cursor-not-allowed disabled:opacity-50';
            return <article className="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"><div className="flex items-start justify-between p-4"><div><div className="flex items-center gap-2"><h3 className="font-bold">{rule.name}</h3><span className={cx('rounded-full px-2 py-0.5 text-[10px] font-bold', rule.enabled ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500')}>{rule.enabled ? '监控中' : '已停用'}</span></div><div className="mt-1 text-xs text-slate-400">更新于 {formatSwitchDate(status.data?.computedAt)}</div></div></div><div className="grid grid-cols-2 gap-2 px-4 pb-4">{[['H', status.h, 'rose'], ['L', status.l, 'emerald']].map(([side, code, tone]) => <div key={side} className={cx('rounded-xl border p-3', tone === 'rose' ? 'border-rose-100 bg-rose-50/70' : 'border-emerald-100 bg-emerald-50/70')}><div className={cx('text-[10px] font-black', tone === 'rose' ? 'text-rose-500' : 'text-emerald-600')}>{side} 组基金</div><div className="mt-1 font-mono text-sm font-black">{code || '未配置'}</div><div className="truncate text-xs text-slate-500">{code ? nameOf(code) : '等待行情'}</div></div>)}</div><div className="border-t border-slate-100 bg-slate-50/70 px-4 py-3"><div className="flex justify-between text-xs"><span className="font-bold">当前待切换：{status.side === 'H' ? 'H → L' : 'L → H'}</span><span className="font-bold text-indigo-600">{status.progress.toFixed(0)}%</span></div><div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-200"><div className="h-full rounded-full bg-indigo-500" style={{ width: `${status.progress}%` }} /></div><div className="mt-2 flex justify-between text-[11px] text-slate-500"><span>H−L {status.gap == null ? '—' : pct(status.gap)}</span><span>H→L {rule.intraBuyOtherPct}% · L→H {rule.intraSellLowerPct}%</span></div></div><div className="flex flex-wrap justify-end gap-2 border-t border-slate-100 px-4 py-3"><button type="button" disabled={busy} onClick={onToggle} className={actionClass}>{rule.enabled ? '暂停' : '启用'}</button><button type="button" disabled={busy} onClick={onEdit} className={actionClass}><Pencil className="h-3.5 w-3.5" />编辑</button><button type="button" disabled={busy} onClick={onDelete} className={cx(actionClass, 'hover:border-rose-200 hover:text-rose-700')}><Trash2 className="h-3.5 w-3.5" />删除</button><button type="button" disabled={busy} onClick={onTest} className={actionClass}>{testing ? <Loader2 className="h-3.5 w-3.5 animate-spin" /> : <FlaskConical className="h-3.5 w-3.5" />}{testing ? '测试中…' : '测试'}</button></div></article>;
          }'''
          s = s[:start] + rule_card + s[end:]
          s = s.replace("const [config, setConfig] = useState(() => normalizeSwitchConfigShape(readSwitchConfigCache())); const [snapshot, setSnapshot] = useState(null); const [loading, setLoading] = useState(true); const [running, setRunning] = useState(false); const [busy, setBusy] = useState(''); const [notice, setNotice] = useState('');", "const [config, setConfig] = useState(() => normalizeSwitchConfigShape(readSwitchConfigCache())); const [snapshot, setSnapshot] = useState(null); const [loading, setLoading] = useState(true); const [busy, setBusy] = useState(''); const [notice, setNotice] = useState(''); const [editingRuleId, setEditingRuleId] = useState('');")
          s = s.replace("function startCreate() { const existing", "function startCreate() { setEditingRuleId(''); const existing")
          s = re.sub(r"\n  async function runNow\(\) \{.*?\n  async function toggleRule", "\n  async function toggleRule", s, count=1, flags=re.S)
          marker = "  async function generate() {"
          handlers = '''  function editRule(rule) { const code = rule.benchmarkCodes?.[0] || ''; setEditingRuleId(rule.id); setSelectedCode(code); setManualCode(''); setFee({ ...DEFAULT_FEE, ...(rule.feeConfig || {}) }); setMode('manual'); setLower(String(rule.intraSellLowerPct ?? 1)); setUpper(String(rule.intraBuyOtherPct ?? 3)); setTimeframe(rule.backtestTimeframe || '5m'); setRecommendation(null); setStep('holding'); setView('create'); setTab('plans'); setNotice(''); }
            async function deleteRule(rule) { if (typeof window !== 'undefined' && !window.confirm(`确认删除「${rule.name || '该方案'}」？`)) return; setBusy(`delete:${rule.id}`); try { const nextRules = rules.filter((item) => item.id !== rule.id); const next = normalizeSwitchConfigShape({ ...config, activeRuleId: nextRules[0]?.id || '', rules: nextRules }); const result = await saveSwitchConfigToWorker(next); setConfig(result?.config || next); setNotice('方案已删除'); } catch (error) { setNotice(error?.message || '删除失败'); } finally { setBusy(''); } }
            async function testRule(rule) { setBusy(`test:${rule.id}`); try { const result = await testSwitchConfig({ enabled: true, activeRuleId: rule.id, rules: [rule] }); if (result?.snapshot) setSnapshot({ snapshot: result.snapshot }); setNotice('测试完成，已更新当前方案分析结果'); } catch (error) { setNotice(error?.message || '测试失败'); } finally { setBusy(''); } }
          '''
          s = s.replace(marker, handlers + marker)
          save_start = s.index('  async function saveRecommendation()')
          save_end = s.index('\n  if (loading)', save_start)
          save_fn = '''  async function saveRecommendation() { if (!recommendation) return; const id = editingRuleId || `switch-${Date.now().toString(36)}`; const all = [recommendation.holdingFundCode, ...recommendation.candidateCodes]; const rule = { id, name: `${recommendation.holdingFundCode} 切换方案`, enabled: editingRuleId ? (rules.find((item) => item.id === editingRuleId)?.enabled ?? true) : true, benchmarkCodes: [recommendation.holdingFundCode], enabledCodes: all, premiumClass: Object.fromEntries(all.map((code) => [code, recommendation.classes[code] || 'L'])), intraSellLowerPct: recommendation.lower, intraBuyOtherPct: recommendation.upper, holdingFundCode: recommendation.holdingFundCode, holdingFundName: recommendation.holdingFundName, holdingQuantity: recommendation.holdingQuantity, holdingNotional: recommendation.holdingNotional, candidateFundCodes: recommendation.candidateCodes, feeConfig: fee, backtestTimeframe: timeframe }; try { const nextRules = editingRuleId ? rules.map((item) => item.id === editingRuleId ? rule : item) : [...rules, rule]; const next = normalizeSwitchConfigShape({ ...config, enabled: true, activeRuleId: id, rules: nextRules }); const result = await saveSwitchConfigToWorker(next); setConfig(result?.config || next); setEditingRuleId(''); setView('list'); setNotice(editingRuleId ? '方案已更新。' : '规则已创建，已开始持续分析。'); } catch (error) { setNotice(error?.message || '保存规则失败'); } }'''
          s = s[:save_start] + save_fn + s[save_end:]
          s = re.sub(r"<div className=\"flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between\"><div className=\"grid grid-cols-3 rounded-xl bg-slate-100 p-1\">(.*?)</div>\{tab === 'plans'.*?</div>\{notice", r"<div className=\"grid grid-cols-3 rounded-xl bg-slate-100 p-1\">\1</div>{notice", s, count=1, flags=re.S)
          old = "<RuleCard key={rule.id} rule={rule} snapshot={snapshot} busy={busy === rule.id} onToggle={() => toggleRule(rule)} />"
          new = "<RuleCard key={rule.id} rule={rule} snapshot={snapshot} busy={Boolean(busy) && !busy.endsWith(rule.id)} testing={busy === `test:${rule.id}`} onToggle={() => toggleRule(rule)} onEdit={() => editRule(rule)} onDelete={() => deleteRule(rule)} onTest={() => testRule(rule)} />"
          if old not in s: raise SystemExit('RuleCard call site not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npx eslint src/pages/SwitchStrategyBetaExperience.jsx --quiet
      - run: npm run check:refactor
      - name: Commit source change and remove temporary workflow
        run: |
          rm .github/workflows/patch-switch-beta-card-actions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/SwitchStrategyBetaExperience.jsx .github/workflows/patch-switch-beta-card-actions.yml
          git commit -m "feat: add beta switch plan card actions"
          git push origin cn