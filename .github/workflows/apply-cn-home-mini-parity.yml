name: Apply CN home Mini Program parity

on:
  push:
    branches:
      - "fix/cn-home-mini-parity"
    paths:
      - ".github/workflows/apply-cn-home-mini-parity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/cn-home-mini-parity"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply patch
        run: python3 scripts/apply_cn_home_mini_parity.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: |
          npm run check:refactor
          npm run build:app
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CnHomeExperience.jsx src/pages/CnFundLimitDetail.jsx src/pages/cn-home.css
          git commit -m "fix: align CN home status and limits with mini program"
          git rm scripts/apply_cn_home_mini_parity.py .github/workflows/apply-cn-home-mini-parity.yml
          git commit -m "chore: remove temporary parity files"
          git push
