name: Apply trade plan CRUD hotfix

on:
  push:
    branches: [cn]
    paths:
      - .github/workflows/cn-trade-plan-crud-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cn
          fetch-depth: 0
      - name: Patch trade plan CRUD calls
        run: |
          python3 <<'PY'
          from pathlib import Path

          new_plan = Path('src/pages/NewPlanExperience.jsx')
          text = new_plan.read_text()
          text = text.replace(
              "import { syncTradePlanRules } from '../app/notifySync.js';",
              "import { putAccountResourceItem } from '../app/accountApi.js';"
          )
          text = text.replace(
              "    persistPlanState({\n",
              "    const persisted = persistPlanState({\n",
              1
          )
          old = """    let syncFailed = false;
              try {
                await syncTradePlanRules();
              } catch {
                // The local strategy has already been saved. Keep navigation responsive.
                syncFailed = true;
              } finally {
                showToast({
                  title: isEditing ? '加仓计划已更新' : '加仓计划已保存',
                  description: syncFailed ? '计划已保存，本次提醒规则未同步。' : '计划已保存，提醒规则已同步。',
                  tone: syncFailed ? 'amber' : 'emerald',
                  persist: true
                });
                trackActionResult('new_plan', isEditing ? 'edit_save' : 'create', syncFailed ? 'partial' : 'success', {
                  ...newPlanMeta(),
                  syncFailed,
                  durationMs: Date.now() - startedAt
                });
          """
          replacement = """    let accountSyncFailed = false;
              try {
                await putAccountResourceItem('plans/store', persisted.id, persisted);
              } catch {
                // 本地计划已经保存；账号资源写入失败不阻塞返回列表。
                accountSyncFailed = true;
              } finally {
                showToast({
                  title: isEditing ? '加仓计划已更新' : '加仓计划已保存',
                  description: accountSyncFailed ? '计划已保存，本次账号数据同步失败。' : '计划已保存到账号。',
                  tone: accountSyncFailed ? 'amber' : 'emerald',
                  persist: true
                });
                trackActionResult('new_plan', isEditing ? 'edit_save' : 'create', accountSyncFailed ? 'partial' : 'success', {
                  ...newPlanMeta(),
                  accountSyncFailed,
                  durationMs: Date.now() - startedAt
                });
          """
          if old not in text:
              raise SystemExit('NewPlanExperience save block not found')
          text = text.replace(old, replacement, 1)
          new_plan.write_text(text)

          trade_plans = Path('src/pages/TradePlansExperience.jsx')
          text = trade_plans.read_text()
          text = text.replace(
              "import { clearWorkspaceReturn, readWorkspaceReturn } from '../app/workspaceReturn.js';",
              "import { clearWorkspaceReturn, readWorkspaceReturn } from '../app/workspaceReturn.js';\nimport { deleteAccountResourceItem } from '../app/accountApi.js';"
          )
          text = text.replace('  function handleDeletePlanRow(row) {', '  async function handleDeletePlanRow(row) {', 1)
          old = """    if (row.sourceType === 'dca') {
              clearDcaState(row.sourceId);
              showActionToast('删除定投计划', 'success');
            } else if (row.sourceType === 'sell' && row.sourceId) {
              deleteSellPlan(row.sourceId);
              showActionToast('删除卖出计划', 'success');
            } else if (row.sourceType === 'plan' && row.sourceId) {
              const removed = deletePlan(row.sourceId);
              if (!removed) return;
              showActionToast('删除加仓计划', 'success');
            } else {
              return;
            }
            setOpenMenuRowId('');
            setPlanRefreshKey((value) => value + 1);
            trackActionResult('trade_plans', 'delete', 'success', meta);
          """
          replacement = """    let accountResource = '';
            let actionLabel = '';
            if (row.sourceType === 'dca' && row.sourceId) {
              clearDcaState(row.sourceId);
              accountResource = 'dca/store';
              actionLabel = '删除定投计划';
            } else if (row.sourceType === 'sell' && row.sourceId) {
              deleteSellPlan(row.sourceId);
              accountResource = 'sell-plans/store';
              actionLabel = '删除卖出计划';
            } else if (row.sourceType === 'plan' && row.sourceId) {
              const removed = deletePlan(row.sourceId);
              if (!removed) return;
              accountResource = 'plans/store';
              actionLabel = '删除加仓计划';
            } else {
              return;
            }
            let accountSyncFailed = false;
            try {
              await deleteAccountResourceItem(accountResource, row.sourceId);
            } catch {
              accountSyncFailed = true;
            }
            showActionToast(actionLabel, accountSyncFailed ? 'warning' : 'success', {
              description: accountSyncFailed ? '本地已删除，账号数据同步失败。' : '本地和账号数据均已删除。'
            });
            setOpenMenuRowId('');
            setPlanRefreshKey((value) => value + 1);
            trackActionResult('trade_plans', 'delete', accountSyncFailed ? 'partial' : 'success', { ...meta, accountSyncFailed });
          """
          if old not in text:
              raise SystemExit('TradePlansExperience delete block not found')
          text = text.replace(old, replacement, 1)
          trade_plans.write_text(text)
          PY
      - name: Verify obsolete save call is gone
        run: |
          ! grep -q "syncTradePlanRules" src/pages/NewPlanExperience.jsx
          grep -q "putAccountResourceItem('plans/store'" src/pages/NewPlanExperience.jsx
          grep -q "deleteAccountResourceItem(accountResource" src/pages/TradePlansExperience.jsx
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/cn-trade-plan-crud-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NewPlanExperience.jsx src/pages/TradePlansExperience.jsx .github/workflows/cn-trade-plan-crud-hotfix.yml
          git commit -m "fix: use account CRUD for trade plans"
          git push origin HEAD:cn
