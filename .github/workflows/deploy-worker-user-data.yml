name: Deploy TiDB user-data worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/user-data/**'
      - '.github/workflows/deploy-worker-user-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-user-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy user-data worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/user-data/wrangler.toml

      - name: Print deployment summary
        if: always()
        run: |
          echo "### TiDB user-data worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
