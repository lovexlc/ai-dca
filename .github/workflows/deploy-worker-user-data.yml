name: Deploy TiDB user-data worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/user-data/**'
      - '.github/workflows/deploy-worker-user-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-user-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-user-data
      url: https://api.freebacktrack.tech/api/user-data/health
    env:
      HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm install --prefix workers/user-data --no-save mysql2@3.13.0

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HYPERDRIVE_ID"

      - name: Render Wrangler config
        env:
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
        run: |
          set -euo pipefail
          test -f workers/user-data/wrangler.toml
          sed "s/__HYPERDRIVE_ID__/${HYPERDRIVE_ID}/g" \
            workers/user-data/wrangler.toml \
            > workers/user-data/wrangler.deploy.toml

      - name: Deploy user-data Worker via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/user-data/wrangler.deploy.toml

      - name: Verify Worker health
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsS \
            --max-time 30 \
            https://api.freebacktrack.tech/api/user-data/health \
            | tee /tmp/user-data-health.json
          grep -q '"authority":"tidb"' /tmp/user-data-health.json
          grep -q '"configured":true' /tmp/user-data-health.json

      - name: Print deployment summary
        if: always()
        run: |
          echo "### TiDB user-data Worker deploy (Hyperdrive)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Hyperdrive: configured from repository variable" >> "$GITHUB_STEP_SUMMARY
