name: Diagnose CN lint

on:
  pull_request:
    branches: [cn]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagnose-cn-lint.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint and capture output
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat lint-output.txt
          exit 0
      - name: Publish lint output to PR
        if: steps.lint.outputs.status != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8');
            const body = [
              '<!-- cn-lint-diagnostic -->',
              `CN lint diagnostic (exit ${process.env.LINT_STATUS})`,
              '',
              '```text',
              output.slice(-60000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Fail if lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
