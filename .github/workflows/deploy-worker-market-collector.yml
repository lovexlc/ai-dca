name: Deploy market-collector worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/market-collector/**'
      - '.github/workflows/deploy-worker-market-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-market-collector
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy market-collector worker via Wrangler
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/market-collector/wrangler.toml

      - name: Print deployment summary
        if: always()
        run: |
          echo "### market-collector worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NOTE: standalone collector only. The notify worker still reads" >> "$GITHUB_STEP_SUMMARY"
          echo "market data from the cn host — no data-source switch yet." >> "$GITHUB_STEP_SUMMARY"
