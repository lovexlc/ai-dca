name: Deploy auth service to CN

on:
  push:
    branches:
      - cn
    paths:
      - 'services/auth/**'
      - '.github/workflows/deploy-auth-service.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'deploy or import-d1'
        required: false
        default: 'deploy'

permissions:
  contents: read

concurrency:
  group: deploy-auth-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-cn

    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
      AUTH_DIR: /opt/ai-dca-auth
      AUTH_DATA_DIR: /var/lib/ai-dca-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_HOST"
          test -n "$CN_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Package auth service
        run: |
          set -euo pipefail
          tar -czf /tmp/ai-dca-auth.tgz \
            --exclude='node_modules' \
            -C services/auth .
          ls -lh /tmp/ai-dca-auth.tgz

      - name: Upload to CN host
        env:
          INTERNAL_SYNC_TOKEN: ${{ secrets.INTERNAL_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # Write token to a file for sftp upload (more reliable than piping through ssh)
          printf '%s' "$INTERNAL_SYNC_TOKEN" > /tmp/internal_sync_token.txt
          chmod 600 /tmp/internal_sync_token.txt
          sftp -o StrictHostKeyChecking=yes "$CN_USER@$CN_HOST" <<'SFTP'
          put /tmp/ai-dca-auth.tgz /tmp/ai-dca-auth.tgz
          put /tmp/internal_sync_token.txt /tmp/internal_sync_token.txt
          bye
          SFTP
          rm -f /tmp/internal_sync_token.txt
          echo "Files uploaded"

      - name: Deploy auth service on CN host
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$CN_USER@$CN_HOST" \
            "AUTH_DIR='$AUTH_DIR' AUTH_DATA_DIR='$AUTH_DATA_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          stamp=$(date +%Y%m%d%H%M%S)
          
          # Install auth service
          install -d -m 755 "$AUTH_DIR"
          install -d -m 755 "$AUTH_DATA_DIR"
          tar -xzf /tmp/ai-dca-auth.tgz -C "$AUTH_DIR"
          rm -f /tmp/ai-dca-auth.tgz
          
          # Install dependencies
          cd "$AUTH_DIR"
          # Ensure Node.js 22+ is installed (required for node:sqlite)
          if ! command -v node >/dev/null || ! node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 22 ? 0 : 1)" 2>/dev/null; then
            echo "Installing Node.js 22..."
            # Download and install Node.js 22 binary directly (no apt dependency)
            NODE_VERSION="v22.14.0"
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              NODE_ARCH="x64"
            elif [ "$ARCH" = "aarch64" ]; then
              NODE_ARCH="arm64"
            else
              echo "ERROR: Unsupported architecture: $ARCH"
              exit 1
            fi
            cd /tmp
            curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" -o node.tar.xz
            tar -xf node.tar.xz
            cp -a "node-${NODE_VERSION}-linux-${NODE_ARCH}/bin/node" /usr/bin/node
            cp -a "node-${NODE_VERSION}-linux-${NODE_ARCH}/bin/npm" /usr/bin/npm 2>/dev/null || true
            cp -a "node-${NODE_VERSION}-linux-${NODE_ARCH}/bin/npx" /usr/bin/npx 2>/dev/null || true
            rm -rf node.tar.xz "node-${NODE_VERSION}-linux-${NODE_ARCH}"
            echo "Node.js installed: $(node --version)"
          else
            echo "Node.js already installed: $(node --version)"
          fi
          npm install --production
          
          # Read token
          INTERNAL_SYNC_TOKEN=$(cat /tmp/internal_sync_token.txt)
          rm -f /tmp/internal_sync_token.txt
          if [ -z "$INTERNAL_SYNC_TOKEN" ]; then
            echo "ERROR: INTERNAL_SYNC_TOKEN is empty"
            exit 1
          fi
          
          # Create systemd service for HTTP server
          cat > /etc/systemd/system/ai-dca-auth.service <<EOF
          [Unit]
          Description=ai-dca local auth service
          After=network.target
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=$AUTH_DIR
          Environment=AUTH_DB_PATH=$AUTH_DATA_DIR/auth.sqlite
          Environment=AUTH_PORT=8080
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/node $AUTH_DIR/src/server.js
          Restart=always
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Create systemd service for sync worker
          cat > /etc/systemd/system/ai-dca-auth-sync.service <<EOF
          [Unit]
          Description=ai-dca auth sync worker
          After=network.target ai-dca-auth.service
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=$AUTH_DIR
          Environment=AUTH_DB_PATH=$AUTH_DATA_DIR/auth.sqlite
          Environment=SYNC_WORKER_URL=https://api.freebacktrack.tech/api/sync/internal/sync-auth
          Environment=INTERNAL_SYNC_TOKEN=$INTERNAL_SYNC_TOKEN
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/node $AUTH_DIR/src/syncWorker.js
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Clear token from environment
          unset INTERNAL_SYNC_TOKEN
          
          systemctl daemon-reload
          systemctl enable ai-dca-auth.service
          systemctl enable ai-dca-auth-sync.service
          systemctl restart ai-dca-auth.service
          systemctl restart ai-dca-auth-sync.service
          
          # Wait for service to start
          sleep 3
          if ! curl -sf http://127.0.0.1:8080/health >/dev/null; then
            echo "ERROR: auth service health check failed"
            systemctl status ai-dca-auth.service --no-pager | head -20
            exit 1
          fi
          
          echo "Auth service deployed and healthy"
          REMOTE

      - name: Configure nginx for auth service
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=15 \
            "$CN_USER@$CN_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail
          
          # Add auth service location to nginx config
          # Must be placed BEFORE the generic /api/ location
          NGINX_CONF="/etc/nginx/sites-available/ai-dca-cn-5000"
          
          if grep -q "location /api/sync/auth/" "$NGINX_CONF"; then
            echo "Auth location already exists, skipping"
          else
            # Insert before the generic /api/ location
            python3 <<'PY'
          from pathlib import Path
          path = Path("/etc/nginx/sites-available/ai-dca-cn-5000")
          text = path.read_text()
          
          auth_block = """    location ^~ /api/sync/auth/ {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          
          """
          
          # Find the generic /api/ location and insert before it
          marker = "    location /api/ {"
          if marker not in text:
              raise SystemExit("generic /api/ location not found")
          
          text = text.replace(marker, auth_block + marker, 1)
          path.write_text(text)
          print("Added auth location to nginx config")
          PY
          fi
          
          nginx -t
          nginx -s reload
          echo "Nginx reloaded"
          REMOTE

      - name: Verify deployment
        run: |
          set -euo pipefail
          # Test via nginx (through the /api/sync/auth/ route)
          # Note: This tests the local auth service through nginx
          ssh \
            -o ServerAliveInterval=15 \
            "$CN_USER@$CN_HOST" \
            "curl -sf http://127.0.0.1:8080/health"
          echo "Deployment verified"
