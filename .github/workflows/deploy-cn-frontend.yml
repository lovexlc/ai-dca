name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Inspect active product collector source
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base=/root/ai-dca/services/market-collector
          test -d "$base"
          echo '=== git status / origin ==='
          cd /root/ai-dca
          git status --short services/market-collector || true
          git remote -v | head -10 || true
          git rev-parse --abbrev-ref HEAD || true
          git rev-parse HEAD || true
          echo '=== files ==='
          find "$base" -maxdepth 3 -type f -not -path '*/.venv/*' -not -path '*/data/*' -printf '%P\n' | sort | head -300
          echo '=== dispatch ==='
          grep -RInE 'def do_(GET|POST)|path ==|path\.startswith|route|endpoint|/api/|/quotes|/klines|fund-limit|fund-fee|nav-history' "$base/market_collector" --include='*.py' | head -500 || true
          echo '=== product_http_server ==='
          sed -n '1,420p' "$base/market_collector/product_http_server.py"
          echo '=== server tests matching routes ==='
          grep -RInE '/api/|/quotes|/klines|fund-limit|fund-fee|nav-history' "$base/tests" --include='*.py' | head -500 || true
          REMOTE
