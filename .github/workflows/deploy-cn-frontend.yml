name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-collector:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
          fetch-depth: 0

      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Import sanitized collector source
        run: |
          set -euo pipefail
          rm -rf services/market-collector
          mkdir -p services/market-collector
          ssh "$CN_USER@$CN_HOST" 'cd /root/ai-dca/services/market-collector && tar -czf - \
            --exclude="*/__pycache__/*" --exclude="*.pyc" \
            README.md config.example.json requirements.txt deploy market_collector tests' \
            | tar -xzf - -C services/market-collector
          find services/market-collector -type f | sort
          test -f services/market-collector/market_collector/http_server.py
          test ! -e services/market-collector/config.json
          test ! -e services/market-collector/data

      - name: Commit collector source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/market-collector
          git diff --cached --check
          git commit -m 'chore(cn): version market collector source'
          git push origin HEAD:fix/cn-user-market-routing-boundary
