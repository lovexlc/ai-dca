name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Inspect collector route handlers
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/ai-dca-market-collector
          echo '=== route dispatch lines ==='
          grep -nE 'def do_(GET|POST)|path ==|path\.startswith|startswith\("/api|def _handle_' collector.py | head -300 || true
          echo '=== collector dispatch ==='
          sed -n '460,760p' collector.py
          echo '=== routes.py public functions ==='
          grep -nE '^def |^class |URL|eastmoney|danjuan|xueqiu|gtimg|nav|kline|quote|fund' routes.py | head -350 || true
          echo '=== nav history search ==='
          grep -RInE 'nav-history|nav_history|NAV history|holdings/nav' . --include='*.py' | head -150 || true
          echo '=== tests route names ==='
          grep -RInE '/api/|/quotes|/klines|/fund-|nav-history|nav_history' test_*.py | head -350 || true
          REMOTE
