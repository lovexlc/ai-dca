name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts
      - name: Inspect current collector runtime
        run: |
          set -euo pipefail
          ssh root@"$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== SERVICE ==='
          systemctl status ai-dca-market-collector --no-pager -l || true
          echo '=== UNIT ==='
          systemctl cat ai-dca-market-collector || true
          echo '=== 18080 ==='
          ss -ltnp | grep ':18080' || true
          PID=$(ss -ltnp 2>/dev/null | awk '/:18080/ { if (match($0,/pid=[0-9]+/)) { print substr($0,RSTART+4,RLENGTH-4); exit } }')
          if [ -n "${PID:-}" ] && [ -d "/proc/$PID" ]; then
            echo "PID=$PID"
            echo -n 'CMD='; tr '\0' ' ' < "/proc/$PID/cmdline"; echo
            echo "CWD=$(readlink -f /proc/$PID/cwd || true)"
            echo "EXE=$(readlink -f /proc/$PID/exe || true)"
            echo '=== FD TARGETS ==='
            ls -l "/proc/$PID/fd" | head -80 || true
          fi
          echo '=== OPT ==='
          find /opt -maxdepth 4 -type f \( -name 'collector.py' -o -name '*market*collector*' -o -name '*.service' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -100 || true
          echo '=== WWW/SRV/HOME ==='
          find /srv /var/www /root -maxdepth 5 -type f -name 'collector.py' -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -100 || true
          REMOTE
