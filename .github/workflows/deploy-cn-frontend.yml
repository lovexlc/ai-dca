              )
              raw, elapsed, size = fetch(url, "https://finance.sina.com.cn/")
              start, end = raw.find("["), raw.rfind("]")
              rows = json.loads(raw[start:end + 1]) if start >= 0 and end > start else []
              return summarize("sina", period, limit, rows, elapsed, size, raw)


          def danjuan(period, value, limit):
