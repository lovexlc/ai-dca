                  break
          print("HISTORY_CAP " + json.dumps({
              "provider": "danjuan_nav", "period": "1d", "requested": 300,
              "rows": len(nav_rows), "ok": bool(nav_rows), "attempts": nav_attempts,
          }, ensure_ascii=False, sort_keys=True), flush=True)
          PY

