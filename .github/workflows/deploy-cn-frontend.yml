name: Apply CN Market Boundary Finalizer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
          fetch-depth: 0
      - name: Apply finalizer
        run: python3 scripts/finalize_cn_market_boundary.py
      - name: Validate source
        run: |
          set -euo pipefail
          python3 -m py_compile services/market-collector/market_collector/*.py
          if grep -R -n -F 'api.freebacktrack.tech/api/markets' services/market-collector/market_collector --include='*.py'; then exit 1; fi
          if grep -R -n -F 'api.freebacktrack.tech/api/holdings/nav-history' services/market-collector/market_collector --include='*.py'; then exit 1; fi
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/market-collector/market_collector/aggregates.py services/market-collector/market_collector/core.py services/market-collector/market_collector/http_server.py services/market-collector/config.example.json
          git diff --cached --check
          git commit -m 'fix(cn): finalize local market data boundary'
          git push origin HEAD:fix/cn-user-market-routing-boundary
