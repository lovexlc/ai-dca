              "tencent": tencent,
              "sina": sina,
              "danjuan": danjuan,
          }
          for period, values in PERIODS.items():
              for provider, fn in providers.items():
                  attempts = []
                  best = None
                  for limit in LIMITS:
                      try:
                          output = fn(period, values[provider], limit)
                          attempts.append({"requested": limit, "rows": output["rows"], "error": output.get("raw", "")})
                          if output["rows"] > 0:
                              best = output
                              break
                      except Exception as exc:
                          attempts.append({"requested": limit, "rows": 0, "error": f"{type(exc).__name__}: {str(exc)[:120]}"})
                  final = best or {
                      "provider": provider, "period": period, "requested": 0,
                      "rows": 0, "first": "", "last": "", "elapsedMs": 0, "bytes": 0,
                  }
                  final["ok"] = final["rows"] > 0
                  final["attempts"] = attempts
                  print("HISTORY_CAP " + json.dumps(final, ensure_ascii=False, sort_keys=True), flush=True)

          today = time.strftime("%Y-%m-%d")
          nav_rows = []
          nav_attempts = []
