name: Inspect CN Collector Runtime Ownership

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts
      - name: Inspect runtime ownership
        run: |
          ssh "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== IDENTITY ==='
          hostname || true
          printf 'HOSTNAME=%s\n' "${HOSTNAME:-}"
          printf 'PID1='; tr '\0' ' ' </proc/1/cmdline; echo
          echo '=== LISTENER ==='
          ss -ltnp | grep ':18080' || true
          pid=$(ss -ltnp | sed -n 's/.*:18080.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)
          printf 'pid=%s\n' "${pid:-none}"
          if [ -n "${pid:-}" ]; then
            ppid=$(awk '/^PPid:/{print $2}' "/proc/$pid/status")
            printf 'ppid=%s\n' "$ppid"
            printf 'cmd='; tr '\0' ' ' < "/proc/$pid/cmdline"; echo
            if [ -n "$ppid" ] && [ -r "/proc/$ppid/cmdline" ]; then
              printf 'parent='; tr '\0' ' ' < "/proc/$ppid/cmdline"; echo
            fi
          fi
          echo '=== PROCESS TREE ==='
          ps -eo pid,ppid,lstart,args --forest | sed -n '1,160p'
          echo '=== REPO ==='
          cd /root/ai-dca
          git status --short --branch || true
          git remote -v | sed -n '1,4p' || true
          git rev-parse HEAD || true
          git branch --show-current || true
          echo '=== MOUNTS ==='
          findmnt -T /root/ai-dca || true
          findmnt -T /root/ai-dca/services/market-collector/data || true
          echo '=== K8S TOOLS ==='
          command -v kubectl || true
          command -v crictl || true
          command -v docker || true
          command -v supervisorctl || true
          ls -la /var/run/secrets/kubernetes.io/serviceaccount 2>/dev/null || true
          echo '=== PROJECT FILES ==='
          ls -la /root/ai-dca/services/market-collector | sed -n '1,100p'
          REMOTE
