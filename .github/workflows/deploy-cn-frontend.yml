name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Export collector source
        run: |
          set -euo pipefail
          mkdir -p exported
          ssh "$CN_USER@$CN_HOST" 'cd /root/ai-dca/services/market-collector && tar -czf - \
            README.md config.example.json requirements.txt deploy market_collector tests \
            --exclude="*/__pycache__/*" --exclude="*.pyc"' > exported/market-collector-source.tgz
          test -s exported/market-collector-source.tgz
          tar -tzf exported/market-collector-source.tgz | head -100

      - name: Upload collector source
        uses: actions/upload-artifact@v4
        with:
          name: market-collector-source
          path: exported/market-collector-source.tgz
          if-no-files-found: error
          retention-days: 1
