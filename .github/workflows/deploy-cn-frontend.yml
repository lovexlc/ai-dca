name: Repair CN Market Routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore collector source from pre-repair commit
        run: |
          set -euo pipefail
          git show 95e811c0efe35954609ef16f53f06c885776c229:services/market-collector/market_collector/aggregates.py > services/market-collector/market_collector/aggregates.py
          git show 95e811c0efe35954609ef16f53f06c885776c229:services/market-collector/market_collector/http_server.py > services/market-collector/market_collector/http_server.py
          git show 95e811c0efe35954609ef16f53f06c885776c229:services/market-collector/market_collector/otc.py > services/market-collector/market_collector/otc.py
      - name: Apply local-only market routing patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('services/market-collector/market_collector/aggregates.py')
          s=p.read_text()
          s=s.replace('import math\n', 'import math\nimport re\n')
          s=s.replace('NAV_HISTORY_URL = "https://api.freebacktrack.tech/api/holdings/nav-history"\nMARKETS_KLINE_URL = "https://api.freebacktrack.tech/api/markets/kline"\n', 'DANJUAN_NAV_HISTORY_URL = "https://danjuanfunds.com/djapi/fund/nav/history/{code}"\n')
          helper='''\n\ndef _fetch_danjuan_nav_history(code: str, from_date: str, to_date: str, timeout_sec: float) -> list[dict[str, Any]]:\n    normalized = str(code or "").strip()\n    if not re.fullmatch(r"\\d{6}", normalized):\n        raise ValueError("invalid fund code")\n    items: list[dict[str, Any]] = []\n    page_size = 100\n    for page in range(1, 51):\n        params = urllib.parse.urlencode({"page": page, "size": page_size})\n        request = urllib.request.Request(\n            DANJUAN_NAV_HISTORY_URL.format(code=urllib.parse.quote(normalized)) + "?" + params,\n            headers={"accept": "application/json, text/plain, */*", "referer": "https://danjuanfunds.com/", "user-agent": "Mozilla/5.0 market-collector/1"},\n        )\n        with urllib.request.urlopen(request, timeout=timeout_sec) as response:\n            payload = json.loads(response.read().decode("utf-8", "replace"))\n        rows = ((payload.get("data") or {}).get("items")) or []\n        if not rows:\n            break\n        reached_before_range = False\n        for row in rows:\n            nav_date = str(row.get("date") or "")[:10]\n            nav = _number(row.get("nav", row.get("value")))\n            if not re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", nav_date):\n                continue\n            if nav_date < from_date:\n                reached_before_range = True\n                continue\n            if nav_date > to_date or nav is None or nav <= 0:\n                continue\n            items.append({"date": nav_date, "nav": _round4(nav)})\n        total = int((payload.get("data") or {}).get("total_items") or 0)\n        if reached_before_range or (total > 0 and page * page_size >= total):\n            break\n    dedup = {item["date"]: item for item in items}\n    return [dedup[key] for key in sorted(dedup)]\n'''
          pos=s.index('\ndef _shanghai_iso')
          s=s[:pos]+helper+s[pos:]
          old='''        def load_navs() -> dict[str, list[dict[str, Any]]]:\n            payload = self.post_json(NAV_HISTORY_URL, {\n                "codes": codes, "from": start.isoformat(), "to": today.isoformat(),\n            }, self.timeout_sec)\n            result: dict[str, list[dict[str, Any]]] = {}\n            for entry in payload.get("items") or []:\n                code = str(entry.get("code") or "")\n                rows = ((entry.get("data") or {}).get("items")) or []\n                valid = [\n                    {"date": str(row.get("date") or "")[:10], "nav": _round4(row.get("nav"))}\n                    for row in rows if _number(row.get("nav")) is not None and _number(row.get("nav")) > 0\n                ]\n                result[code] = valid\n            return result\n'''
          new='''        def load_navs() -> dict[str, list[dict[str, Any]]]:\n            result: dict[str, list[dict[str, Any]]] = {}\n            missing = [code for code in codes if not (metrics.get(code) or {}).get("latestNav")]\n            if not missing:\n                return result\n            with ThreadPoolExecutor(max_workers=min(6, len(missing))) as executor:\n                futures = {executor.submit(_fetch_danjuan_nav_history, code, start.isoformat(), today.isoformat(), self.timeout_sec): code for code in missing}\n                for future, code in ((future, futures[future]) for future in futures):\n                    try:\n                        result[code] = future.result()\n                    except Exception:\n                        result[code] = []\n            return result\n'''
          if old not in s: raise SystemExit('aggregates nav block changed')
          s=s.replace(old,new)
          old='''        def load() -> dict[str, Any]:\n            fallback_params = urllib.parse.urlencode({"tf": "1d", "limit": limit})\n            try:\n                fallback = self.fetch_json(f"{MARKETS_KLINE_URL}/{symbol}?{fallback_params}", self.timeout_sec)\n                rows = []\n                for item in fallback.get("candles") or []:\n                    candle_date = str(item.get("date") or datetime.fromtimestamp(float(item.get("t") or 0), SHANGHAI).date().isoformat())[:10]\n                    rows.append(",".join(str(value if value is not None else "") for value in [\n                        candle_date, item.get("o"), item.get("c"), item.get("h"), item.get("l"),\n                        item.get("v"), item.get("amount"), item.get("amplitudePercent"),\n                        item.get("changePercent"), item.get("change"), item.get("turnoverRate"),\n                    ]))\n                raw = {"data": {"name": fallback.get("name") or symbol, "klines": rows}}\n                source = "markets-worker"\n            except Exception:\n                raw = self.fetch_json(EASTMONEY_KLINE_URL + "?" + params, min(self.timeout_sec, 3.0))\n                source = "eastmoney-push2his-fallback"\n'''
          new='''        def load() -> dict[str, Any]:\n            raw = self.fetch_json(EASTMONEY_KLINE_URL + "?" + params, self.timeout_sec)\n            source = "eastmoney-push2his"\n'''
          if old not in s: raise SystemExit('aggregates kline block changed')
          s=s.replace(old,new)
          old='''        params = urllib.parse.urlencode({"code": symbol, "from": from_date.isoformat(), "to": to_date.isoformat()})\n\n        def load() -> dict[str, Any]:\n            payload = self.fetch_json(NAV_HISTORY_URL + "?" + params, self.timeout_sec)\n            items = []\n            for item in payload.get("items") or []:\n                nav_date = str(item.get("date") or "")[:10]\n                nav = _number(item.get("nav"))\n                if nav_date and nav is not None and nav > 0:\n                    items.append({"date": nav_date, "t": _date_epoch(nav_date), "nav": _round4(nav)})\n            return {\n                "symbol": symbol, "from": from_date.isoformat(), "to": to_date.isoformat(),\n                "generatedAt": payload.get("generatedAt") or _shanghai_iso(datetime.now(timezone.utc)),\n                "source": "holdings-nav-history", "items": items,\n            }\n'''
          new='''        def load() -> dict[str, Any]:\n            rows = _fetch_danjuan_nav_history(symbol, from_date.isoformat(), to_date.isoformat(), self.timeout_sec)\n            items = [{"date": item["date"], "t": _date_epoch(item["date"]), "nav": item["nav"]} for item in rows]\n            return {"symbol": symbol, "from": from_date.isoformat(), "to": to_date.isoformat(), "generatedAt": _shanghai_iso(datetime.now(timezone.utc)), "source": "danjuan-nav-history", "items": items}\n'''
          if old not in s: raise SystemExit('aggregates history block changed')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('services/market-collector/market_collector/otc.py')
          s=p.read_text().replace('FUND_METRICS_URL = "https://api.freebacktrack.tech/api/markets/fund-metrics"', 'FUND_METRICS_URL = "http://127.0.0.1:18080/fund-metrics"')
          p.write_text(s)

          p=Path('services/market-collector/market_collector/http_server.py')
          s=p.read_text()
          s=s.replace('UPSTREAM_API_BASE = "https://api.freebacktrack.tech/api"\nUPSTREAM_MARKETS_BASE = "https://api.freebacktrack.tech/api/markets"\n','')
          s=s.replace('def _normalize_web_route(path: str) -> str:\n    for prefix in ("/api/market-collector", "/api/markets"):', 'def _normalize_web_route(path: str) -> str:\n    if path == "/api/holdings/nav-history":\n        return "/nav-history"\n    for prefix in ("/api/market-collector", "/api/markets"):')
          s=s.replace('    "/list-rows", "/exchange-fund-list",\n}', '    "/list-rows", "/exchange-fund-list", "/nav-history",\n}')
          start=s.index('def _upstream_target('); end=s.index('\ndef _fetch_sec_json', start)
          s=s[:start]+'''def proxy_market_request(\n    method: str, path: str, body: dict[str, Any] | None, timeout_sec: float = 25.0,\n) -> tuple[int, dict[str, Any]]:\n    parsed = urlparse(path)\n    route = _normalize_web_route(parsed.path.rstrip("/") or "/")\n    return HTTPStatus.NOT_IMPLEMENTED, {"error": "collector_market_route_missing", "path": route, "detail": "Market routes must be implemented by the CN market collector."}\n\n'''+s[end+1:]
          old='''        local = _local_quote(data_service, match.group("symbol"))\n        if offline and local is not None:\n            return HTTPStatus.OK, local\n        if offline:\n            return HTTPStatus.NOT_FOUND, {"error": "symbol_not_found", "symbol": match.group("symbol")}\n        upstream_status, upstream = proxy_request(\n            method,\n            route + (("?" + parsed.query) if parsed.query else ""),\n            None,\n        )\n        if local:\n            return HTTPStatus.OK, _merge_fresh_record(\n                upstream if upstream_status == HTTPStatus.OK else {},\n                local,\n            )\n        return upstream_status, upstream\n'''
          if old not in s: raise SystemExit('quote proxy block changed')
          s=s.replace(old,'''        local = _local_quote(data_service, match.group("symbol"))\n        if local is not None:\n            return HTTPStatus.OK, local\n        return HTTPStatus.NOT_FOUND, {"error": "symbol_not_found", "symbol": match.group("symbol")}\n''')
          qstart=s.index('        if offline:\n            if local_quotes:', s.index('if route == "/quotes"')); qend=s.index('\n    match = WEB_KLINE_PATH', qstart)
          s=s[:qstart]+'''        if local_quotes:\n            return HTTPStatus.OK, {"quotes": local_quotes, "generatedAt": max((str(item.get("asOf") or "") for item in local_quotes.values()), default=""), "source": "market-collector"}\n        return HTTPStatus.NOT_FOUND, {"error": "symbols_not_found", "symbols": requested}\n'''+s[qend:]
          kst=s.index('    match = WEB_KLINE_PATH'); kproxy=s.index('        return proxy_request(', kst); kend=s.index('\n\n    if route == "/fund-metrics" and data_service and method == "POST":', kproxy)
          s=s[:kproxy]+'        return HTTPStatus.NOT_FOUND, {"error": "symbol_not_found", "symbol": match.group("symbol")}'+s[kend:]
          pst=s.index('        def load_local_items()', s.index('if route == "/fund-metrics" and data_service and method == "POST"')); pend=s.index('\n    if route == "/fund-metrics" and data_service:', pst)
          s=s[:pst]+'''        try:\n            items = [item for item in data_service.fund_metrics(codes) if isinstance(item, dict)]\n        except Exception as exc:\n            return HTTPStatus.SERVICE_UNAVAILABLE, {"error": "local_fund_metrics_failed", "detail": str(exc)}\n        return HTTPStatus.OK, {"items": items, "successCount": len(items), "failureCount": len(codes) - len(items), "generatedAt": max((str(item.get("asOf") or item.get("updatedAt") or "") for item in items), default=""), "source": "market-collector"}\n'''+s[pend:]
          anchor='    if route == "/fund-metrics" and data_service and method == "POST":\n'
          nav='''    if route == "/nav-history" and data_service:\n        if method not in {"GET", "POST"}: return HTTPStatus.METHOD_NOT_ALLOWED, {"error": "method_not_allowed"}\n        raw_codes = [str((query.get("code") or [""])[0]).strip()] if method == "GET" else [str(code or "").strip() for code in (body or {}).get("codes") or []]\n        codes = list(dict.fromkeys(code for code in raw_codes if re.fullmatch(r"\\d{6}", code)))[:60]\n        if not codes: return HTTPStatus.BAD_REQUEST, {"error": "codes_required"}\n        days = _int_param(query, "days", 365, 3650) if method == "GET" else max(1, min(int((body or {}).get("days") or 365), 3650))\n        from_raw = str((query.get("from") or [""])[0]).strip() if method == "GET" else str((body or {}).get("from") or "").strip()\n        to_raw = str((query.get("to") or [""])[0]).strip() if method == "GET" else str((body or {}).get("to") or "").strip()\n        results=[]\n        for code in codes:\n            try:\n                payload=data_service.nav_history(code, days); items=payload.get("items") or []\n                if re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", from_raw): items=[item for item in items if str(item.get("date") or "")[:10] >= from_raw]\n                if re.fullmatch(r"\\d{4}-\\d{2}-\\d{2}", to_raw): items=[item for item in items if str(item.get("date") or "")[:10] <= to_raw]\n                normalized=[{"date": item.get("date"), "nav": item.get("nav")} for item in items]\n                data={"ok": True, "code": code, "items": normalized, "count": len(normalized), "from": from_raw or payload.get("from"), "to": to_raw or payload.get("to"), "generatedAt": payload.get("generatedAt"), "source": payload.get("source")}\n                results.append({"code": code, "ok": True, "data": data})\n            except Exception as exc: results.append({"code": code, "ok": False, "error": str(exc)})\n        if method == "GET":\n            first=results[0]; return (HTTPStatus.OK, first["data"]) if first.get("ok") else (HTTPStatus.BAD_GATEWAY, first)\n        return HTTPStatus.OK, {"ok": True, "count": len(results), "items": results, "source": "market-collector"}\n\n'''
          s=s.replace(anchor,nav+anchor,1)
          old='''        except (HTTPError, OSError, TimeoutError, ValueError, json.JSONDecodeError):\n            return proxy_request(\n                method,\n                route + (("?" + parsed.query) if parsed.query else ""),\n                None,\n            )\n\n    if _is_web_api_route(route):\n        return proxy_request(\n            method,\n            route + (("?" + parsed.query) if parsed.query else ""),\n            body,\n        )\n'''
          if old not in s: raise SystemExit('bottom proxy block changed')
          s=s.replace(old,'''        except (HTTPError, OSError, TimeoutError, ValueError, json.JSONDecodeError) as exc:\n            return HTTPStatus.BAD_GATEWAY, {"error": "financials_source_failed", "detail": str(exc)}\n\n    if route == "/market-summary" and data_service and method == "GET":\n        region=str((query.get("region") or query.get("market") or ["US"])[0]).upper(); payload=data_service.market_summary(region)\n        return (HTTPStatus.OK, payload) if payload is not None else (HTTPStatus.BAD_REQUEST, {"error": "unsupported_market"})\n    if route == "/indices" and data_service and method == "GET":\n        region=str((query.get("market") or query.get("region") or ["US"])[0]).upper(); payload=data_service.market_summary(region) or {"items": []}\n        return HTTPStatus.OK, {**payload, "source": "market-collector"}\n    if route == "/summary" and data_service and method == "GET": return HTTPStatus.OK, data_service.home_overview()\n    if route == "/search" and data_service and method == "GET":\n        needle=str((query.get("q") or [""])[0]).strip().lower(); limit=_int_param(query, "limit", 20, 100); records=[]\n        for code,item in data_service._latest_by_symbol().items():\n            name=str(item.get("name") or code)\n            if needle and needle not in code.lower() and needle not in name.lower(): continue\n            quote=data_service.quote(code) or data_service.fund_metric(code) or {}; records.append({"symbol": code, "code": code, "name": name, **quote})\n            if len(records)>=limit: break\n        return HTTPStatus.OK, {"items": records, "results": records, "source": "market-collector"}\n    if route == "/movers" and data_service and method == "GET":\n        direction=str((query.get("direction") or ["gainers"])[0]).lower(); limit=_int_param(query, "limit", 10, 100); rows=[data_service.quote(code) for code in data_service._latest_by_symbol()]; rows=[item for item in rows if isinstance(item,dict) and isinstance(item.get("changePercent"),(int,float))]; rows.sort(key=lambda item: float(item.get("changePercent") or 0), reverse=direction not in {"losers","down"}); return HTTPStatus.OK, {"items": rows[:limit], "source": "market-collector"}\n    if route == "/fund-fee" and data_service and method == "GET":\n        code=str((query.get("code") or query.get("symbol") or [""])[0]).strip()\n        if not re.fullmatch(r"\\d{6}",code): return HTTPStatus.BAD_REQUEST,{"error":"code_required"}\n        payload=data_service.dataset_record("fund-fee",code); return (HTTPStatus.OK,payload) if payload is not None else (HTTPStatus.NOT_FOUND,{"error":"fund_fee_not_found","code":code})\n    if route in {"/sectors","/news","/earnings","/taco","/list-rows","/exchange-fund-list"}: return HTTPStatus.OK,{"items":[],"source":"market-collector","capability":"local-empty"}\n    if route.startswith("/xueqiu-fund-data/") and data_service and method == "GET":\n        code=route.rsplit("/",1)[-1]; payload=data_service.fund_metric(code); return (HTTPStatus.OK,payload) if payload is not None else (HTTPStatus.NOT_FOUND,{"error":"symbol_not_found","symbol":code})\n    if route.startswith("/profile/") and data_service and method == "GET":\n        symbol=route.rsplit("/",1)[-1]; local_symbol=_local_symbol(symbol) or symbol; payload=_local_quote(data_service,symbol) or data_service.fund_metric(local_symbol); return (HTTPStatus.OK,payload) if payload is not None else (HTTPStatus.NOT_FOUND,{"error":"symbol_not_found","symbol":symbol})\n    if _is_web_api_route(route): return HTTPStatus.NOT_IMPLEMENTED,{"error":"collector_market_route_missing","path":route,"detail":"Add this market capability to services/market-collector."}\n''')
          p.write_text(s)
          PY
      - name: Validate repaired collector
        run: |
          set -euo pipefail
          python3 -m py_compile services/market-collector/market_collector/aggregates.py services/market-collector/market_collector/http_server.py services/market-collector/market_collector/otc.py
          ! grep -R -n -F 'api.freebacktrack.tech/api/markets' services/market-collector/market_collector --include='*.py'
          ! grep -R -n -F 'api.freebacktrack.tech/api/holdings/nav-history' services/market-collector/market_collector --include='*.py'
      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/market-collector/market_collector/aggregates.py services/market-collector/market_collector/http_server.py services/market-collector/market_collector/otc.py
          git diff --cached --check
          git commit -m 'fix(cn): keep market reads inside local collector'
          git push origin HEAD:fix/cn-user-market-routing-boundary
