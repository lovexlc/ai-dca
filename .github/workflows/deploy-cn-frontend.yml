name: Deploy CN Frontend

on:
  push:
    branches:
      - fix/cn-remote-account-source-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-remote-account-source-v2
          fetch-depth: 0

      - name: Restore clean CN target files and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cn
          git checkout origin/cn -- src/app/accountResources.js src/app/authSession.js src/entry-screen.jsx src/pages/HoldingsExperience.jsx src/pages/holdings/useHoldingsStorageSync.js test/accountResourceSync.test.mjs
          rm -f src/app/accountRuntimeStore.js test/accountRemoteReadGuard.test.mjs test/holdingsRemoteSource.test.mjs
          base64 -d .remote-source.patch.gz.b64 | gzip -d > /tmp/remote-source.patch
          echo '84310f481726674efdb0aa4f16c42f688f61d5da2fa230d894ece6ffec11be01  /tmp/remote-source.patch' | sha256sum -c -
          git apply --check /tmp/remote-source.patch
          git apply /tmp/remote-source.patch
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run remote-source regression tests
        run: |
          node --test test/accountRemoteReadGuard.test.mjs test/accountResourceSync.test.mjs test/accountMigrationGate.test.mjs test/holdingsTransactionRows.test.mjs test/holdingsRemoteSource.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Lint changed frontend files
        run: npx eslint --quiet src/app/accountRuntimeStore.js src/app/accountResources.js src/app/authSession.js src/entry-screen.jsx src/pages/HoldingsExperience.jsx src/pages/holdings/useHoldingsStorageSync.js

      - name: Build frontend
        run: npm run build:app

      - name: Commit verified business changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/accountRuntimeStore.js src/app/accountResources.js src/app/authSession.js src/entry-screen.jsx src/pages/HoldingsExperience.jsx src/pages/holdings/useHoldingsStorageSync.js test/accountRemoteReadGuard.test.mjs test/accountResourceSync.test.mjs test/holdingsRemoteSource.test.mjs
          git diff --cached --check
          git commit -m 'fix: make logged-in business data remote authoritative'
          git push origin HEAD:fix/cn-remote-account-source-v2
