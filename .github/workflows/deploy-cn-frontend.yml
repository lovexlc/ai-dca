name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Locate and inspect active collector
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== listener ==='
          ss -ltnp | grep ':18080' || true
          pid=$(ss -ltnp | sed -n 's/.*:18080.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)
          test -n "$pid"
          cwd=$(readlink -f "/proc/$pid/cwd" || true)
          exe=$(readlink -f "/proc/$pid/exe" || true)
          cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline")
          echo "PID=$pid"
          echo "CWD=$cwd"
          echo "EXE=$exe"
          echo "CMD=$cmd"
          script=$(tr '\0' '\n' < "/proc/$pid/cmdline" | grep -E '\.py$' | head -1 || true)
          if [ -n "$script" ] && [ "${script#/}" = "$script" ]; then script="$cwd/$script"; fi
          echo "SCRIPT=$script"
          if [ -z "$script" ] || [ ! -f "$script" ]; then
            echo '=== find collector.py ==='
            find /opt /root /srv /var/www -maxdepth 5 -type f -name collector.py -print 2>/dev/null | head -30
            script=$(find /opt /root /srv /var/www -maxdepth 5 -type f -name collector.py -print 2>/dev/null | head -1 || true)
          fi
          test -f "$script"
          dir=$(dirname "$script")
          echo "DIR=$dir"
          echo '=== route dispatch ==='
          grep -nE 'def do_(GET|POST)|path ==|path\.startswith|def _handle_' "$script" | head -350 || true
          echo '=== source dispatch section ==='
          start=$(grep -n 'def do_GET' "$script" | head -1 | cut -d: -f1)
          if [ -n "$start" ]; then end=$((start+320)); sed -n "${start},${end}p" "$script"; fi
          echo '=== nav history search ==='
          grep -RInE 'nav-history|nav_history|holdings/nav' "$dir" --include='*.py' | head -200 || true
          echo '=== market provider/search terms ==='
          grep -RInE 'eastmoney|danjuan|xueqiu|gtimg|quotes|klines|fund-limit|fund-fee' "$dir" --include='*.py' | head -350 || true
          REMOTE
