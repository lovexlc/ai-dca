name: Inspect CN Collector Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts
      - name: Inspect runtime
        run: |
          ssh "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== LISTENER ==='
          ss -ltnp | grep ':18080' || true
          pid=$(ss -ltnp | sed -n 's/.*:18080.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)
          echo "pid=${pid:-none}"
          if [ -n "${pid:-}" ]; then
            echo '=== CMD ==='
            tr '\0' ' ' < "/proc/$pid/cmdline"; echo
            echo '=== CGROUP ==='
            cat "/proc/$pid/cgroup" || true
            echo '=== SYSTEMD STATUS PID ==='
            systemctl status "$pid" --no-pager || true
          fi
          echo '=== SYSTEMD CANDIDATES ==='
          systemctl list-units --type=service --all --no-pager | grep -Ei 'market|collector|ai-dca' || true
          echo '=== SUPERVISOR ==='
          supervisorctl status 2>/dev/null || true
          REMOTE
