name: Restore CN Routing Repair Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
          fetch-depth: 0
      - name: Restore routing repair workflow
        run: |
          set -euo pipefail
          git show f8dc8ef809082691b7b853c9f24e9c9858d5f4f2:.github/workflows/deploy-cn-frontend.yml > .github/workflows/deploy-cn-frontend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-cn-frontend.yml
          git commit -m 'ci: restore routing repair workflow'
          git push origin HEAD:fix/cn-user-market-routing-boundary
