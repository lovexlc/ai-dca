name: Validate CN Market Routing Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collector boundary and syntax
        run: |
          set -euo pipefail
          python3 -m py_compile services/market-collector/market_collector/*.py
          ! grep -R -n -F 'api.freebacktrack.tech/api/markets' services/market-collector/market_collector --include='*.py'
          ! grep -R -n -F 'api.freebacktrack.tech/api/holdings/nav-history' services/market-collector/market_collector --include='*.py'
          ! grep -R -n '^<PLACEHOLDER>$' services/market-collector/market_collector --include='*.py'
      - name: Collector tests
        run: PYTHONPATH=services/market-collector python3 -m unittest discover -s services/market-collector/tests -p 'test_*.py'
      - name: Refactor guard
        run: npm run check:refactor
      - name: CN frontend build
        env:
          VITE_API_ORIGIN: https://cn.freebacktrack.tech:5000
          VITE_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector
        run: npm run build:app
      - name: Bundle boundary
        run: |
          set -euo pipefail
          grep -R --include='*.js' -Fq 'https://cn.freebacktrack.tech:5000' .frontend-build
          if grep -R --include='*.js' -F 'https://api.freebacktrack.tech' .frontend-build; then
            echo '::error::CN browser bundle directly calls api.freebacktrack.tech'
            exit 1
          fi
