name: Deploy CN Frontend

on:
  push:
    branches:
      - cn
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/check_refactor_guard.mjs'
      - 'services/market-collector/**'
      - '.github/workflows/deploy-cn-frontend.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: CN operation to run
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - benchmark_sources

permissions:
  contents: read

concurrency:
  group: cn-frontend
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/cn' && inputs.operation != 'benchmark_sources'
    runs-on: ubuntu-latest
    environment:
      name: production-cn
      url: https://cn.freebacktrack.tech:5000

    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_VERIFY_IP: 47.92.221.14
      CN_USER: root
      CN_TARGET_DIR: /var/www/ai-dca-cn
      CN_RELEASES_DIR: /var/www/ai-dca-cn-releases
      CN_SITE_ORIGIN: https://cn.freebacktrack.tech:5000
      CN_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Test market collector
        run: |
          set -euo pipefail
          python -m pip install -r services/market-collector/requirements.txt
          PYTHONPATH=services/market-collector \
            python -m unittest discover \
              -s services/market-collector/tests \
              -p 'test_*.py'

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Build frontend
        run: npm run build:app
        env:
          VITE_API_ORIGIN: ${{ env.CN_SITE_ORIGIN }}
          VITE_MARKETS_API_BASE: ${{ env.CN_MARKETS_API_BASE }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com

      - name: Verify CN API targets
        run: |
          set -euo pipefail
          grep -R --include='*.js' -Fq "$CN_MARKETS_API_BASE" .frontend-build
          grep -R --include='*.js' -Fq "$CN_SITE_ORIGIN" .frontend-build
          if grep -R --include='*.js' -F "https://api.freebacktrack.tech" .frontend-build; then
            echo "::error::CN frontend bundle still contains direct api.freebacktrack.tech requests"
            exit 1
          fi

      - name: Package frontend and market collector
        run: |
          set -euo pipefail
          tar -C .frontend-build -czf /tmp/ai-dca-frontend.tgz .
          tar -C services/market-collector \
            --exclude='.venv' \
            --exclude='data' \
            --exclude='config.json' \
            -czf /tmp/ai-dca-market-collector.tgz .

      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_HOST"
          test -n "$CN_USER"
          test -n "$CN_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          set -euo pipefail
          scp -O \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            /tmp/ai-dca-frontend.tgz \
            /tmp/ai-dca-market-collector.tgz \
            "$CN_USER@$CN_HOST:/tmp/"

      - name: Deploy on CN host
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$CN_USER@$CN_HOST" \
            "CN_TARGET_DIR='$CN_TARGET_DIR' CN_RELEASES_DIR='$CN_RELEASES_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          stamp=$(date +%Y%m%d%H%M%S)
          release="$CN_RELEASES_DIR/$stamp"

          install -d -m 755 "$CN_RELEASES_DIR"
          install -d -m 755 "$release"
          tar -xzf /tmp/ai-dca-frontend.tgz -C "$release"

          if id www-data >/dev/null 2>&1; then
            chown -R www-data:www-data "$release"
          fi

          if [ -d "$CN_TARGET_DIR" ] && [ ! -L "$CN_TARGET_DIR" ]; then
            mv "$CN_TARGET_DIR" "$CN_TARGET_DIR.backup.$stamp"
          fi

          ln -sfn "$release" "$CN_TARGET_DIR"

          # CN 浏览器统一走同源 /api/*。Cloudflare API 使用 upstream keepalive，
          # 普通 HTTP 请求不再发送 Connection: close；WebSocket 仍按 Upgrade 头升级。
          cat > /etc/nginx/conf.d/ai-dca-websocket-map.conf <<'NGINX_MAP'
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      '';
          }
          NGINX_MAP

          cat > /etc/nginx/conf.d/ai-dca-cf-api-upstream.conf <<'NGINX_UPSTREAM'
          upstream ai_dca_cf_api {
              server api.freebacktrack.tech:443;
              keepalive 64;
              keepalive_requests 1000;
              keepalive_timeout 60s;
          }
          NGINX_UPSTREAM

          python3 - <<'PY_NGINX'
          from pathlib import Path

          path = Path('/etc/nginx/sites-available/ai-dca-cn-5000')
          text = path.read_text()
          marker = '    location /api/ {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('generic /api/ nginx location not found')

          depth = 0
          end = None
          for pos in range(start, len(text)):
              ch = text[pos]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = pos + 1
                      break
          if end is None:
              raise SystemExit('generic /api/ nginx location is malformed')

          block = text[start:end]
          if 'proxy_pass https://api.freebacktrack.tech;' in block:
              block = block.replace('proxy_pass https://api.freebacktrack.tech;', 'proxy_pass https://ai_dca_cf_api;', 1)
          elif 'proxy_pass https://ai_dca_cf_api;' not in block:
              raise SystemExit('generic /api/ proxy target changed unexpectedly')

          anchor = '        proxy_set_header X-Forwarded-Proto $scheme;\n'
          websocket = (
              '        proxy_set_header Upgrade $http_upgrade;\n'
              '        proxy_set_header Connection $connection_upgrade;\n'
          )
          if 'proxy_set_header Upgrade $http_upgrade;' not in block:
              if anchor not in block:
                  raise SystemExit('generic /api/ proxy header anchor not found')
              block = block.replace(anchor, anchor + websocket, 1)
          if 'proxy_set_header Connection $connection_upgrade;' not in block:
              upgrade = '        proxy_set_header Upgrade $http_upgrade;\n'
              block = block.replace(upgrade, upgrade + '        proxy_set_header Connection $connection_upgrade;\n', 1)

          ssl_anchor = '        proxy_set_header Host api.freebacktrack.tech;\n'
          ssl_settings = (
              '        proxy_ssl_server_name on;\n'
              '        proxy_ssl_name api.freebacktrack.tech;\n'
              '        proxy_ssl_session_reuse on;\n'
          )
          if 'proxy_ssl_name api.freebacktrack.tech;' not in block:
              if ssl_anchor not in block:
                  raise SystemExit('generic /api/ Host header anchor not found')
              block = block.replace(ssl_anchor, ssl_anchor + ssl_settings, 1)

          timeout_anchor = '        proxy_read_timeout 300s;\n'
          if 'proxy_read_timeout 30s;' in block:
              block = block.replace('        proxy_read_timeout 30s;', '        proxy_read_timeout 300s;')
          if timeout_anchor not in block:
              if 'proxy_read_timeout' not in block:
                  block = block.replace('    }', '        proxy_read_timeout 300s;\n    }', 1)
          retry_settings = (
              '        proxy_next_upstream error timeout http_502 http_503 http_504;\n'
              '        proxy_next_upstream_tries 2;\n'
          )
          if 'proxy_next_upstream_tries 2;' not in block:
              block = block.replace('        proxy_read_timeout 300s;\n', '        proxy_read_timeout 300s;\n' + retry_settings, 1)

          updated = text[:start] + block + text[end:]
          if updated != text:
              backup = path.with_name(path.name + '.before-same-origin-api')
              if not backup.exists():
                  backup.write_text(text)
              path.write_text(updated)
          PY_NGINX

          nginx -t
          nginx -s reload

          # Deploy the public market collector source while preserving runtime state.
          collector_dir=/root/ai-dca/services/market-collector
          collector_stage=/tmp/ai-dca-market-collector-$stamp
          install -d -m 755 "$collector_dir" "$collector_stage"
          tar -xzf /tmp/ai-dca-market-collector.tgz -C "$collector_stage"
          test -f "$collector_stage/market_collector/http_server.py"
          test -f "$collector_stage/deploy/supervisor.conf"
          test -x "$collector_dir/.venv/bin/python"
          test -f "$collector_dir/config.json"
          cp -a "$collector_stage/." "$collector_dir/"
          if [ -f "$collector_dir/requirements.txt" ]; then
            "$collector_dir/.venv/bin/pip" install -r "$collector_dir/requirements.txt"
          fi
          install -m 644 "$collector_dir/deploy/supervisor.conf" /etc/market-collector-supervisord.conf
          supervisorctl -c /etc/market-collector-supervisord.conf reread
          supervisorctl -c /etc/market-collector-supervisord.conf update
          supervisorctl -c /etc/market-collector-supervisord.conf restart market-collector
          supervisorctl -c /etc/market-collector-supervisord.conf restart market-collector-api
          supervisorctl -c /etc/market-collector-supervisord.conf status

          # Outside trading hours the daemon may not immediately run a collection cycle.
          # Bootstrap a snapshot on deploy when /health has no published health.json yet.
          if ! curl --noproxy '*' -fsS --max-time 10 http://127.0.0.1:18080/health >/tmp/market-collector-local-health.json; then
            echo "market collector health snapshot is unavailable after restart; running one bootstrap collection"
            tail -n 80 /var/log/supervisor/market-collector.err.log 2>/dev/null || true
            tail -n 80 /var/log/supervisor/market-collector.log 2>/dev/null || true
            PYTHONPATH="$collector_dir" \
              "$collector_dir/.venv/bin/python" -m market_collector \
              --root "$collector_dir" \
              --config "$collector_dir/config.json" \
              --once
          fi
          curl --noproxy '*' --retry 10 --retry-delay 2 --retry-all-errors -fsS --max-time 20 http://127.0.0.1:18080/health >/tmp/market-collector-local-health.json
          grep -q 'market-collector-shadow-health' /tmp/market-collector-local-health.json

          find "$CN_RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
          rm -rf "$collector_stage"
          rm -f /tmp/ai-dca-frontend.tgz /tmp/ai-dca-market-collector.tgz
          REMOTE

      - name: Verify CN production
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$CN_USER@$CN_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsSI --max-time 20 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/ | sed -n '1,20p'
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsS --max-time 30 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/ >/tmp/freebacktrack-cn-home.html
          grep -q '<title>美股策略助手</title>' /tmp/freebacktrack-cn-home.html
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsSI --max-time 20 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/markets | sed -n '1,20p'
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsS --max-time 20 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/api/market-collector/health >/tmp/freebacktrack-cn-market-health.json
          grep -q 'market-collector-shadow-health' /tmp/freebacktrack-cn-market-health.json
          grep -Fq 'data_service = MarketDataService' /root/ai-dca/services/market-collector/market_collector/product_http_server.py
          if grep -Fq 'build_product_store' /root/ai-dca/services/market-collector/market_collector/product_http_server.py; then
            echo 'market-collector-api still initializes the TiDB product store' >&2
            exit 1
          fi

          symbols='513100,513500,159501,159660,159941,513390,513300,513110,159696,159659,159632,159513'
          measure_quote() {
            label=$1
            url=$2
            output=$3
            timing=$(curl --noproxy '*' -fsS --max-time 20 -o "$output" \
              -w 'TTFB=%{time_starttransfer} TOTAL=%{time_total} HTTP=%{http_code}' "$url")
            printf '%s %s\n' "$label" "$timing"
            grep -q '513100' "$output"
          }

          measure_quote collector-cold \
            "http://127.0.0.1:18080/quotes?symbols=$symbols" \
            /tmp/market-collector-quotes-cold.json
          measure_quote collector-warm \
            "http://127.0.0.1:18080/quotes?symbols=$symbols" \
            /tmp/market-collector-quotes-warm.json
          sleep 3
          measure_quote collector-after-3s \
            "http://127.0.0.1:18080/quotes?symbols=$symbols" \
            /tmp/market-collector-quotes-after-3s.json
          measure_quote nginx-complete \
            "https://cn.freebacktrack.tech:5000/api/market-collector/quotes?symbols=$symbols" \
            /tmp/freebacktrack-cn-market-quotes.json
          grep -q '513100' /tmp/freebacktrack-cn-market-quotes.json
          curl --noproxy '*' --retry 5 --retry-delay 2 --retry-all-errors -fsS --max-time 20 --resolve cn.freebacktrack.tech:5000:127.0.0.1 https://cn.freebacktrack.tech:5000/api/account/v1/health >/tmp/freebacktrack-cn-account-health.json
          grep -q '"ok"' /tmp/freebacktrack-cn-account-health.json
          nginx -T 2>&1 | grep -Fq 'upstream ai_dca_cf_api'
          nginx -T 2>&1 | grep -Fq 'keepalive 64;'
          nginx -T 2>&1 | grep -Fq "''      '';"
          nginx -T 2>&1 | grep -Fq 'proxy_pass https://ai_dca_cf_api;'
          nginx -T 2>&1 | grep -Fq 'proxy_ssl_name api.freebacktrack.tech;'
          nginx -T 2>&1 | grep -Fq 'proxy_set_header Upgrade $http_upgrade;'
          nginx -T 2>&1 | grep -Fq 'proxy_set_header Connection $connection_upgrade;'
          REMOTE

          if ! curl --retry 3 --retry-delay 2 --retry-all-errors -fsSI --max-time 20 --resolve cn.freebacktrack.tech:5000:$CN_VERIFY_IP https://cn.freebacktrack.tech:5000/ | sed -n '1,20p'; then
            echo "::warning::GitHub runner could not complete an external HEAD request to cn.freebacktrack.tech:5000, but SSH local HTTPS verification passed."
          fi

  benchmark-market-sources:
    if: github.ref == 'refs/heads/cn' && github.event_name == 'workflow_dispatch' && inputs.operation == 'benchmark_sources'
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root

    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_HOST"
          test -n "$CN_USER"
          test -n "$CN_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Benchmark source concurrency on CN host
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$CN_USER@$CN_HOST" \
            "PYTHONPATH=/root/ai-dca/services/market-collector /root/ai-dca/services/market-collector/.venv/bin/python -u -" <<'PY'
          from __future__ import annotations

          import json
          import math
          import statistics
          import time
          import urllib.parse
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta
          from itertools import cycle, islice
          from zoneinfo import ZoneInfo

          from market_collector.aggregates import (
              DANJUAN_NAV_HISTORY_URL,
              EASTMONEY_KLINE_URL,
              _fetch_danjuan_nav_history,
              _fetch_json,
          )
          from market_collector.sources import fetch_tencent_quotes

          ETF_CODES = [
              "513100", "513500", "159501", "159660", "159941", "513390",
              "513300", "513110", "159696", "159659", "159632", "159513",
              "513650", "159612", "159655", "513850",
          ]
          NAV_CODES = [
              "000834", "008971", "270042", "006479", "000055", "006480",
              "021778", "161130", "012870", "012871", "003722", "040046",
              "040047", "040048", "014978", "016055",
          ]
          LEVELS = [1, 2, 4, 8, 12, 16]
          TIMEOUT_SEC = 15.0
          SHANGHAI = ZoneInfo("Asia/Shanghai")


          def percentile(values: list[float], fraction: float) -> float:
              ordered = sorted(values)
              return ordered[max(0, math.ceil(len(ordered) * fraction) - 1)]


          def run_case(provider: str, concurrency: int, fn, values: list[str]) -> None:
              task_count = max(6, concurrency)
              inputs = list(islice(cycle(values), task_count))
              durations: list[float] = []
              errors: Counter[str] = Counter()
              result_sizes: list[int] = []

              def invoke(value: str):
                  started = time.perf_counter()
                  try:
                      size = int(fn(value))
                      if size <= 0:
                          raise RuntimeError("empty_payload")
                      return True, (time.perf_counter() - started) * 1000, size, ""
                  except Exception as exc:
                      label = f"{type(exc).__name__}:{str(exc)[:120]}"
                      return False, (time.perf_counter() - started) * 1000, 0, label

              wall_started = time.perf_counter()
              with ThreadPoolExecutor(max_workers=concurrency) as executor:
                  futures = [executor.submit(invoke, value) for value in inputs]
                  for future in as_completed(futures):
                      ok, duration, size, error = future.result()
                      durations.append(duration)
                      if ok:
                          result_sizes.append(size)
                      else:
                          errors[error] += 1
              wall_ms = (time.perf_counter() - wall_started) * 1000
              succeeded = len(result_sizes)
              payload = {
                  "provider": provider,
                  "concurrency": concurrency,
                  "tasks": task_count,
                  "success": succeeded,
                  "failed": task_count - succeeded,
                  "wallMs": round(wall_ms, 1),
                  "p50Ms": round(statistics.median(durations), 1),
                  "p95Ms": round(percentile(durations, 0.95), 1),
                  "throughputRps": round(succeeded / (wall_ms / 1000), 2) if wall_ms else 0,
                  "minResultItems": min(result_sizes) if result_sizes else 0,
                  "errors": dict(errors),
              }
              print("BENCH " + json.dumps(payload, ensure_ascii=False, sort_keys=True), flush=True)


          def tencent_price(_value: str) -> int:
              return len(fetch_tencent_quotes(ETF_CODES, TIMEOUT_SEC))


          def eastmoney_kline(code: str) -> int:
              secid = ("1." if code.startswith(("5", "6")) else "0.") + code
              params = urllib.parse.urlencode({
                  "secid": secid,
                  "klt": 101,
                  "fqt": 1,
                  "lmt": 500,
                  "end": 20500101,
                  "fields1": "f1,f2,f3,f4,f5,f6",
                  "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
              })
              payload = _fetch_json(EASTMONEY_KLINE_URL + "?" + params, TIMEOUT_SEC)
              return len((payload.get("data") or {}).get("klines") or [])


          def danjuan_nav(code: str) -> int:
              today = datetime.now(SHANGHAI).date()
              rows = _fetch_danjuan_nav_history(
                  code,
                  (today - timedelta(days=365)).isoformat(),
                  today.isoformat(),
                  TIMEOUT_SEC,
                  _fetch_json,
              )
              return len(rows)


          print("BENCH_META " + json.dumps({
              "hostTime": datetime.now(SHANGHAI).isoformat(),
              "levels": LEVELS,
              "timeoutSec": TIMEOUT_SEC,
              "eastmoneyUrl": EASTMONEY_KLINE_URL,
              "danjuanUrl": DANJUAN_NAV_HISTORY_URL,
              "tencentBatchSymbols": len(ETF_CODES),
          }, sort_keys=True), flush=True)

          for provider, fn, values in (
              ("tencent_price_batch", tencent_price, ["batch"]),
              ("eastmoney_kline_500", eastmoney_kline, ETF_CODES),
              ("danjuan_nav_365d", danjuan_nav, NAV_CODES),
          ):
              fn(values[0])
              for concurrency in LEVELS:
                  run_case(provider, concurrency, fn, values)
          PY
