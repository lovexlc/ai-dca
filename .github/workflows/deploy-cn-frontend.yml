name: Inspect CN Collector Supervisor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts
      - name: Inspect supervisor
        run: |
          ssh "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== SUPERVISOR CONFIG SUMMARY ==='
          grep -E '^\[program:|^directory=|^command=|^serverurl=|^file=' /etc/market-collector-supervisord.conf || true
          echo '=== STATUS ==='
          supervisorctl -c /etc/market-collector-supervisord.conf status || true
          echo '=== DEPLOY DIRECTORY ==='
          ls -la /root/market-collector-deploy | sed -n '1,120p' || true
          REMOTE
