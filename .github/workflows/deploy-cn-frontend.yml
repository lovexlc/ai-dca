name: Deploy CN Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CN_HOST: rdfo1495558.bohrium.tech
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cn-market-user-routing-boundary
          fetch-depth: 0

      - name: Inventory frontend API paths
        run: |
          set -euo pipefail
          echo '=== FRONTEND API REFERENCES ==='
          grep -RInE "(/api/[A-Za-z0-9_?&=./:{}~-]+|apiUrl\(|wsApiUrl\()" src --include='*.js' --include='*.jsx' | head -1200 || true

      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Import live collector source
        run: |
          set -euo pipefail
          mkdir -p services/cn-market-collector
          scp root@"$CN_HOST":/opt/ai-dca-market-collector/collector.py services/cn-market-collector/collector.py
          python3 -m py_compile services/cn-market-collector/collector.py
          grep -nE "path (==|in)|REMOVED_CLOUD_PATHS|api.freebacktrack.tech|collector_cloudflare_upstream_disabled" services/cn-market-collector/collector.py | head -250 || true

      - name: Commit collector source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/cn-market-collector/collector.py
          if git diff --cached --quiet; then
            echo 'collector source already current'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(cn): track market collector source'
          git push origin HEAD:fix/cn-market-user-routing-boundary
