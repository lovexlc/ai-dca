name: Validate CN Market Routing Boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-user-market-routing-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate collector source boundary
        run: |
          set -euo pipefail
          python3 -m py_compile services/market-collector/market_collector/*.py
          if grep -R -n -F 'api.freebacktrack.tech/api/markets' services/market-collector/market_collector --include='*.py'; then
            echo '::error::collector must not call Cloudflare markets API'
            exit 1
          fi
          if grep -R -n -F 'api.freebacktrack.tech/api/holdings/nav-history' services/market-collector/market_collector --include='*.py'; then
            echo '::error::NAV history must be local market data'
            exit 1
          fi
          if grep -R -n '^<PLACEHOLDER>$' services/market-collector/market_collector --include='*.py'; then
            echo '::error::placeholder collector source remains'
            exit 1
          fi
      - name: Run collector unit tests
        run: PYTHONPATH=services/market-collector python3 -m unittest discover -s services/market-collector/tests -p 'test_*.py'
      - name: Check frontend refactor guard
        run: npm run check:refactor
      - name: Build CN frontend
        env:
          VITE_API_ORIGIN: https://cn.freebacktrack.tech:5000
          VITE_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector
        run: npm run build:app
      - name: Verify CN bundle routing
        run: |
          set -euo pipefail
          grep -R --include='*.js' -Fq 'https://cn.freebacktrack.tech:5000' .frontend-build
          if grep -R --include='*.js' -F 'https://api.freebacktrack.tech' .frontend-build; then
            echo '::error::CN browser bundle must not directly call api.freebacktrack.tech'
            exit 1
          fi
