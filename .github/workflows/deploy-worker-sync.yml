name: Deploy sync worker

on:
  push:
    branches:
      - main
      - cn
    paths:
      - 'workers/sync/**'
      - '.github/workflows/deploy-worker-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove historical non-user analytics events
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: d1 execute ai-dca-sync-db --remote --file workers/sync/migrations/20260911_remove_non_user_analytics.sql

      - name: Deploy sync worker via Wrangler
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/sync/wrangler.toml

      - name: Print deployment summary
        if: always()
        run: |
          echo "### sync worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
