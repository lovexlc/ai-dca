name: Apply CN home workspace patch
on:
  push:
    branches: [feat/cn-local-home]
    paths: [scripts/apply_cn_home_workspace.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/cn-local-home}
      - run: python scripts/apply_cn_home_workspace.py
      - run: npm ci && npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/WorkspacePage.jsx
          git commit -m 'feat(cn): wire home into workspace' || exit 0
          git push
