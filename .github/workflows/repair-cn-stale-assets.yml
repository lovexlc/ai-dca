name: Preserve CN frontend lazy chunks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-cn-stale-assets.yml'
  workflow_run:
    workflows:
      - Deploy CN Frontend
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preserve-cn-frontend-lazy-chunks
  cancel-in-progress: false

jobs:
  preserve-assets:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'cn')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          CN_HOST: rdfo1495558.bohrium.tech
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$CN_HOST"
          test -n "$CN_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Preserve recent hashed chunks in current release
        env:
          CN_HOST: rdfo1495558.bohrium.tech
          CN_USER: root
          CN_TARGET_DIR: /var/www/ai-dca-cn
          CN_RELEASES_DIR: /var/www/ai-dca-cn-releases
        run: |
          set -euo pipefail
          ssh "$CN_USER@$CN_HOST" \
            "CN_TARGET_DIR='$CN_TARGET_DIR' CN_RELEASES_DIR='$CN_RELEASES_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          current=$(readlink -f "$CN_TARGET_DIR")
          test -n "$current"
          test -d "$current/react-assets"

          find "$CN_RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d \
            ! -path "$current" -print | sort | tail -n 5 | while IFS= read -r previous; do
              if [ -d "$previous/react-assets" ]; then
                cp -an "$previous/react-assets/." "$current/react-assets/"
              fi
            done

          test -n "$(find "$current/react-assets" -maxdepth 1 -type f -name '*.js' -print -quit)"
          echo "Preserved lazy chunks in $current"
          REMOTE
