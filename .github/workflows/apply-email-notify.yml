name: Apply email notification patch

on:
  push:
    branches:
      - feature/cn-email-notify
    paths:
      - '.github/workflows/apply-email-notify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cn-email-notify
          fetch-depth: 0

      - name: Rebuild and validate patch
        run: |
          set -euo pipefail
          cat .patches/email-notify.*.b64 | base64 -d | gzip -d > /tmp/email-notify.patch
          git apply --check /tmp/email-notify.patch
          git apply /tmp/email-notify.patch
          rm -rf .patches
          rm -f .github/workflows/apply-email-notify.yml
          git add -A
          git diff --cached --check

      - name: Commit complete implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add verified email notification channel'
          git push origin HEAD:feature/cn-email-notify
