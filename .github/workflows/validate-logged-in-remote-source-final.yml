name: Validate logged-in remote source final

on:
  push:
    branches:
      - fix/cn-remote-account-source-v3
    paths:
      - '.validate-remote-source-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run remote-source regression tests
        run: |
          node --test test/accountRemoteReadGuard.test.mjs test/accountResourceSync.test.mjs test/accountMigrationGate.test.mjs test/holdingsTransactionRows.test.mjs test/holdingsRemoteSource.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Lint changed frontend files
        run: npx eslint --quiet src/app/accountRuntimeStore.js src/app/accountResources.js src/app/authSession.js src/entry-screen.jsx src/pages/HoldingsExperience.jsx src/pages/holdings/useHoldingsStorageSync.js

      - name: Build frontend with CN routing
        run: npm run build:app
        env:
          VITE_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector

      - name: Verify CN market API target
        run: grep -R --include='*.js' -Fq 'https://cn.freebacktrack.tech:5000/api/market-collector' .frontend-build
