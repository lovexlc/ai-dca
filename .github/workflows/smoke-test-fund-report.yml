name: Smoke test fund report demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fund report endpoints
        shell: bash
        run: |
          set -uo pipefail

          probe() {
            local name="$1"
            local url="$2"
            local body
            local status
            body=$(mktemp)
            status=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' "$url" || true)
            echo "===== $name ====="
            echo "HTTP $status"
            cat "$body"
            echo
            rm -f "$body"
          }

          probe meta 'https://test.freebacktrack.tech/api/fund-report?code=270042&meta=1'
          probe ocr_full 'https://test.freebacktrack.tech/api/fund-report?code=270042&force=1'
          probe markets_force 'https://test.freebacktrack.tech/api/markets/fund-report?code=270042&force=1'
          probe markets_read 'https://test.freebacktrack.tech/api/markets/fund-report?code=270042'
