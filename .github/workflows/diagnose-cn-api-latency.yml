name: Diagnose CN API Latency

on:
  push:
    branches: [cn]
    paths: ['.github/workflows/diagnose-cn-api-latency.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment:
      name: production-cn
    env:
      CN_HOST: rdfo1495558.bohrium.tech
      CN_USER: root
    steps:
      - name: Configure SSH
        env:
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$CN_HOST" >> ~/.ssh/known_hosts

      - name: Measure API latency from CN host
        run: |
          set -euo pipefail
          ssh "$CN_USER@$CN_HOST" 'bash -s' <<'REMOTE'
          set -u
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
          export NO_PROXY='127.0.0.1,localhost,api.freebacktrack.tech,cn.freebacktrack.tech'
          export no_proxy="$NO_PROXY"

          measure() {
            label="$1"
            url="$2"
            resolve="${3:-}"
            echo "=== $label ==="
            for i in 1 2 3 4 5; do
              if [ -n "$resolve" ]; then
                curl --noproxy '*' -sS -o /tmp/api-diag-body --connect-timeout 5 --max-time 20 --resolve "$resolve" \
                  -w "try=$i code=%{http_code} remote=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" "$url" || echo "try=$i curl_exit=$?"
              else
                curl --noproxy '*' -sS -o /tmp/api-diag-body --connect-timeout 5 --max-time 20 \
                  -w "try=$i code=%{http_code} remote=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" "$url" || echo "try=$i curl_exit=$?"
              fi
              head -c 160 /tmp/api-diag-body 2>/dev/null || true
              echo
              sleep 1
            done
          }

          echo '=== DNS ==='
          getent ahosts api.freebacktrack.tech | head -n 8 || true
          getent ahosts cn.freebacktrack.tech | head -n 8 || true

          measure 'CN host -> Cloudflare notify health' 'https://api.freebacktrack.tech/api/notify/health'
          measure 'CN host -> Cloudflare account health' 'https://api.freebacktrack.tech/api/account/v1/health'
          measure 'CN nginx -> Cloudflare notify health' 'https://cn.freebacktrack.tech:5000/api/notify/health' 'cn.freebacktrack.tech:5000:127.0.0.1'
          measure 'CN nginx -> Cloudflare account health' 'https://cn.freebacktrack.tech:5000/api/account/v1/health' 'cn.freebacktrack.tech:5000:127.0.0.1'
          REMOTE
