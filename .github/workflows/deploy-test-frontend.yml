name: Deploy test frontend

on:
  push:
    branches:
      - test
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/check_refactor_guard.mjs'
      - '.github/workflows/deploy-test-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.freebacktrack.tech

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check refactor guard
        run: npm run check:refactor

      # 资源目录从 react-assets-v2 轮到 v3：旧目录下有 12 个哈希文件名的边缘缓存
      # 已经被钉死成 index.html（cf-cache-status=HIT、content-type=text/html），
      # 而 ?v= 不进入缓存键，换版本号救不回来。换目录就是换一批全新的缓存键。
      - name: Build test frontend
        run: >-
          VITE_API_ORIGIN=https://test.freebacktrack.tech
          VITE_MARKETS_API_ORIGIN=https://test.freebacktrack.tech
          VITE_NOTIFY_API_ORIGIN=https://test.freebacktrack.tech
          VITE_SYNC_API_ORIGIN=https://test.freebacktrack.tech
          VITE_ASSET_DIR=react-assets-v3
          VITE_ASSET_URL_VERSION=$GITHUB_SHA-$GITHUB_RUN_ID
          VITE_OUT_DIR=.frontend-build npx vite build
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com

      - name: Deploy Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy .frontend-build --project-name ai-dca-test

      # 资源传播到正式域名比到本次部署的专属域名晚一拍，这段窗口期里
      # 任何一次对正式域名的请求都会被 Pages 兑底成 index.html（还是 200）。
      # 所以先在专属域名上等传播完成（那个域名用完即弃），
      # 确认全部资源可用后，再发出对正式域名的第一个请求。
      - name: Verify test frontend
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail

          asset_dir='react-assets-v3'
          deploy_version="$GITHUB_SHA-$GITHUB_RUN_ID"
          site_url="https://test.freebacktrack.tech"
          origin_url="$DEPLOYMENT_URL"
          if [ -z "$origin_url" ]; then
            echo 'wrangler exposed no deployment url; falling back to the public host'
            origin_url="$site_url"
          fi
          origin_url="${origin_url%/}"
          echo "asset dir: $asset_dir"
          echo "deployment origin: $origin_url"
          echo "public host: $site_url"

          cat >/tmp/ai-dca-check-assets.mjs <<'NODE'
          import fs from 'node:fs';

          const base = process.env.BASE_URL;
          const assetDir = process.env.ASSET_DIR;
          const assets = fs.readFileSync(process.env.ASSET_FILE, 'utf8')
            .split(/\r?\n/)
            .map((asset) => asset.trim())
            .filter(Boolean);

          const results = [];
          for (const asset of assets) {
            const url = base + '/' + assetDir + '/' + asset;
            try {
              const response = await fetch(url, {
                headers: {
                  accept: '*/*',
                  referer: base + '/?tab=fundSwitch',
                  'sec-fetch-dest': 'script',
                  'sec-fetch-mode': 'cors',
                  'sec-fetch-site': 'same-origin',
                  'cache-control': 'no-cache'
                },
                signal: AbortSignal.timeout(20000)
              });
              const body = await response.text();
              const contentType = response.headers.get('content-type') || '';
              const cacheStatus = response.headers.get('cf-cache-status') || '-';
              const htmlFallback = body.includes('<!DOCTYPE html>') || body.includes('<html');
              results.push({
                asset,
                ok: response.ok && /javascript|wasm/i.test(contentType) && !htmlFallback,
                status: response.status,
                contentType,
                cacheStatus,
                htmlFallback
              });
            } catch (error) {
              results.push({
                asset,
                ok: false,
                status: 0,
                contentType: String((error && error.message) || error),
                cacheStatus: '-',
                htmlFallback: false
              });
            }
          }

          const failed = results.filter((result) => !result.ok);
          if (failed.length) {
            for (const result of failed) {
              console.error(
                'asset unavailable: status=' + result.status
                  + ' content-type=' + result.contentType
                  + ' cf-cache-status=' + result.cacheStatus
                  + ' html-fallback=' + result.htmlFallback
                  + ' ' + result.asset
              );
            }
            console.error('failed ' + failed.length + ' of ' + results.length + ' assets on ' + base);
            process.exit(1);
          }
          console.log('verified ' + results.length + ' javascript assets on ' + base);
          NODE

          check_assets() {
            BASE_URL="$1" ASSET_DIR="$asset_dir" ASSET_FILE="$2" node /tmp/ai-dca-check-assets.mjs
          }

          fetch_home() {
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$1/?tab=fundSwitch&deploy_probe=$deploy_version" -o "$2"
          }

          home_is_current() {
            grep -q '<title>美股策略助手</title>' "$1" && grep -Fq "v=$deploy_version" "$1"
          }

          echo '--- waiting for the deployment origin to serve this build ---'
          for attempt in $(seq 1 60); do
            if fetch_home "$origin_url" /tmp/ai-dca-origin-home.html && home_is_current /tmp/ai-dca-origin-home.html; then
              echo "deployment origin is serving this build (attempt $attempt)"
              break
            fi
            test "$attempt" -lt 60 || { echo 'deployment origin never served this build' >&2; exit 1; }
            sleep 5
          done

          entry_asset=$(grep -oE "$asset_dir/index-[^\" ]+\.js\?v=[^\" ]+" /tmp/ai-dca-origin-home.html | head -1)
          test -n "$entry_asset"
          printf '%s\n' "${entry_asset#$asset_dir/}" >/tmp/ai-dca-entry-list.txt
          echo "entry asset: $entry_asset"

          echo '--- waiting for the entry chunk to propagate ---'
          for attempt in $(seq 1 60); do
            if check_assets "$origin_url" /tmp/ai-dca-entry-list.txt; then
              break
            fi
            test "$attempt" -lt 60 || { echo 'deployment origin never served the entry chunk as javascript' >&2; exit 1; }
            sleep 5
          done

          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$origin_url/$entry_asset" -o /tmp/ai-dca-entry.js
          grep -q 'const __vite__mapDeps' /tmp/ai-dca-entry.js
          grep -oE '[A-Za-z0-9._-]+\.js\?v=[^" ]+' /tmp/ai-dca-entry.js | sort -u >/tmp/ai-dca-assets.txt
          test -s /tmp/ai-dca-assets.txt
          echo "discovered $(wc -l </tmp/ai-dca-assets.txt) dynamic javascript assets"

          echo '--- waiting for every dynamic chunk to propagate ---'
          for attempt in $(seq 1 60); do
            if check_assets "$origin_url" /tmp/ai-dca-assets.txt; then
              echo "every chunk is live on the deployment origin (attempt $attempt)"
              break
            fi
            test "$attempt" -lt 60 || { echo 'deployment origin never served every javascript asset' >&2; exit 1; }
            sleep 5
          done

          echo '--- fully propagated; now verifying the public host ---'
          for attempt in $(seq 1 12); do
            if fetch_home "$site_url" /tmp/ai-dca-site-home.html && home_is_current /tmp/ai-dca-site-home.html; then
              break
            fi
            test "$attempt" -lt 12 || { echo 'public host did not pick up this build' >&2; exit 1; }
            sleep 5
          done

          site_entry=$(grep -oE "$asset_dir/index-[^\" ]+\.js\?v=[^\" ]+" /tmp/ai-dca-site-home.html | head -1)
          test "$site_entry" = "$entry_asset"

          # 入口 chunk 必须在正式域名上可用，否则页面根本打不开：硬失败。
          for attempt in $(seq 1 12); do
            if check_assets "$site_url" /tmp/ai-dca-entry-list.txt; then
              break
            fi
            test "$attempt" -lt 12 || { echo 'public host did not serve the entry chunk as javascript' >&2; exit 1; }
            sleep 5
          done

          # 动态 chunk 在正式域名上的传播不由我们控制：偶发几个资源会被 Pages
          # 兑底成 index.html。_headers 里已经用 CDN-Cache-Control: no-store 让边缘
          # 不缓存资源响应，这种兑底最多存活一次请求，不会再被钉死，
          # 所以重试拉长到超过边缘 TTL；仍未通过只告警，不再红掉整个部署
          # —— 专属域名上全部资源已逐个验证过，构建本身是完整的。
          assets_ok=0
          for attempt in $(seq 1 10); do
            if check_assets "$site_url" /tmp/ai-dca-assets.txt; then
              assets_ok=1
              break
            fi
            sleep 10
          done
          if [ "$assets_ok" -ne 1 ]; then
            echo '::warning::部分动态 chunk 在正式域名上仍被兑底成 HTML；专属域名已全绿，边缘会在下一次请求自愈'
          fi

          css_asset=$(grep -oE "$asset_dir/[^\" ]+\.css\?v=[^\" ]+" /tmp/ai-dca-site-home.html | head -1)
          test -n "$css_asset"
          curl -fsS --max-time 20 \
            -H 'Accept: text/css' \
            -H 'Origin: https://test.freebacktrack.tech' \
            -H 'Referer: https://test.freebacktrack.tech/?tab=fundSwitch' \
            -D /tmp/ai-dca-css.headers \
            -o /tmp/ai-dca.css \
            "$site_url/$css_asset"
          grep -Eiq '^content-type:.*text/css' /tmp/ai-dca-css.headers
          ! grep -q "url($asset_dir/" /tmp/ai-dca.css

          font_asset=$(grep -oE 'url\([^)]*\.woff2\?v=[^)]+' /tmp/ai-dca.css | head -1 | sed -E 's/^url\(([^)]*).*$/\1/')
          test -n "$font_asset"
          font_asset="${font_asset#./}"
          case "$font_asset" in
            "$asset_dir"/*) ;;
            /*) font_asset="${font_asset#/}" ;;
            *) font_asset="$asset_dir/$font_asset" ;;
          esac
          curl -fsSI --max-time 20 "$site_url/$font_asset" >/tmp/ai-dca-font.headers
          grep -Eiq '^content-type:.*font/(woff|woff2)' /tmp/ai-dca-font.headers

          echo 'test frontend verified'
