name: Deploy test frontend

on:
  push:
    branches:
      - test
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/check_refactor_guard.mjs'
      - '.github/workflows/deploy-test-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.freebacktrack.tech

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Build test frontend
        run: >-
          VITE_API_ORIGIN=https://test.freebacktrack.tech
          VITE_MARKETS_API_ORIGIN=https://test.freebacktrack.tech
          VITE_NOTIFY_API_ORIGIN=https://test.freebacktrack.tech
          VITE_SYNC_API_ORIGIN=https://test.freebacktrack.tech
          VITE_ASSET_DIR=react-assets-v2
          VITE_ASSET_URL_VERSION=${GITHUB_SHA}-${GITHUB_RUN_ID}
          VITE_OUT_DIR=.frontend-build npx vite build
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: https://us.i.posthog.com

      - name: Deploy Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy .frontend-build --project-name ai-dca-test

      - name: Verify test frontend
        run: |
          set -euo pipefail
          curl -fsSI --max-time 20 https://test.freebacktrack.tech/
          curl -fsS --max-time 20 https://test.freebacktrack.tech/?tab=fundSwitch >/tmp/ai-dca-test-home.html
          grep -q '<title>美股策略助手</title>' /tmp/ai-dca-test-home.html
          entry_asset=$(grep -oE 'react-assets-v2/index-[^" ]+\.js\?v=[^" ]+' /tmp/ai-dca-test-home.html | head -1)
          test -n "$entry_asset"

          check_js_asset() {
            local asset_url="$1"
            local headers_file="$2"
            local body_file="$3"
            shift 3
            if ! curl -fsS --max-time 20 \
              -H 'Accept: */*' \
              -H 'Origin: https://test.freebacktrack.tech' \
              -H 'Referer: https://test.freebacktrack.tech/?tab=fundSwitch' \
              -H 'Sec-Fetch-Dest: script' \
              -H 'Sec-Fetch-Mode: cors' \
              -H 'Sec-Fetch-Site: same-origin' \
              "$@" \
              -D "$headers_file" \
              -o "$body_file" \
              "https://test.freebacktrack.tech/$asset_url"; then
              return 1
            fi
            grep -Eiq '^content-type:.*(javascript|wasm)' "$headers_file" && ! grep -q '<!DOCTYPE html>' "$body_file"
          }

          entry_probe="${entry_asset}&probe=readiness"
          for attempt in $(seq 1 12); do
            if check_js_asset "$entry_probe" /tmp/ai-dca-test-entry.headers /tmp/ai-dca-test-entry.js -H 'Cache-Control: no-cache' && grep -q 'const __vite__mapDeps' /tmp/ai-dca-test-entry.js; then
              break
            fi
            test "$attempt" -lt 12 || { echo 'test frontend entry asset did not become available as JavaScript' >&2; exit 1; }
            sleep 5
          done

          # Vite's preload map stores files relative to the asset directory;
          # prepend the deployed directory only when requesting them.
          grep -oE '[A-Za-z0-9._-]+\.js\?v=[^" ]+' /tmp/ai-dca-test-entry.js | sort -u >/tmp/ai-dca-test-assets.txt
          test -s /tmp/ai-dca-test-assets.txt
          for attempt in $(seq 1 12); do
            assets_ready=1
            asset_number=0
            while IFS= read -r asset_name; do
              asset_url="react-assets-v2/$asset_name"
              asset_number=$((asset_number + 1))
              asset_probe="${asset_url}&probe=readiness"
              if ! check_js_asset "$asset_probe" "/tmp/ai-dca-test-asset-$asset_number.headers" "/tmp/ai-dca-test-asset-$asset_number.js" -H 'Cache-Control: no-cache'; then
                assets_ready=0
              fi
            done </tmp/ai-dca-test-assets.txt
            if [ "$assets_ready" -eq 1 ]; then
              break
            fi
            test "$attempt" -lt 12 || { echo 'test frontend dynamic assets did not become available as JavaScript' >&2; exit 1; }
            sleep 5
          done

          check_js_asset "$entry_asset" /tmp/ai-dca-test-entry-final.headers /tmp/ai-dca-test-entry-final.js
          asset_number=0
          while IFS= read -r asset_name; do
            asset_url="react-assets-v2/$asset_name"
            asset_number=$((asset_number + 1))
            check_js_asset "$asset_url" "/tmp/ai-dca-test-final-$asset_number.headers" "/tmp/ai-dca-test-final-$asset_number.js"
          done </tmp/ai-dca-test-assets.txt

          css_asset=$(grep -oE 'react-assets-v2/[^" ]+\.css\?v=[^" ]+' /tmp/ai-dca-test-home.html | head -1)
          test -n "$css_asset"
          curl -fsS --max-time 20 \
            -H 'Accept: text/css' \
            -H 'Origin: https://test.freebacktrack.tech' \
            -H 'Referer: https://test.freebacktrack.tech/?tab=fundSwitch' \
            -D /tmp/ai-dca-test-css.headers \
            -o /tmp/ai-dca-test.css \
            "https://test.freebacktrack.tech/$css_asset"
          grep -Eiq '^content-type:.*text/css' /tmp/ai-dca-test-css.headers
          ! grep -q 'url(react-assets-v2/' /tmp/ai-dca-test.css

          font_asset=$(grep -oE 'url\([^)]*\.woff2\?v=[^)]+' /tmp/ai-dca-test.css | head -1 | sed -E 's/^url\(([^)]*).*$/\1/')
          test -n "$font_asset"
          font_asset="${font_asset#./}"
          case "$font_asset" in
            react-assets-v2/*) ;;
            /*) font_asset="${font_asset#/}" ;;
            *) font_asset="react-assets-v2/$font_asset" ;;
          esac
          curl -fsSI --max-time 20 "https://test.freebacktrack.tech/$font_asset" >/tmp/ai-dca-test-font.headers
          grep -Eiq '^content-type:.*font/(woff|woff2)' /tmp/ai-dca-test-font.headers
