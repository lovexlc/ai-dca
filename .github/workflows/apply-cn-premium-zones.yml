name: Apply CN premium zones

on:
  push:
    branches:
      - fix/cn-premium-zones
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cn-premium-zones
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_cn_premium_zones.py
      - run: npm ci
      - run: npm run check:refactor
      - run: npm run build:app
        env:
          VITE_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector
      - name: Commit generated update
        run: |
          if git diff --quiet -- src/pages/CnHomeExperience.jsx src/pages/cn-home.css; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/CnHomeExperience.jsx src/pages/cn-home.css
          git commit -m "feat: add CN premium zones and endpoint labels"
          git push origin HEAD:fix/cn-premium-zones
