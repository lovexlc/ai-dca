name: Apply CN brand and 022523 correction

on:
  push:
    branches:
      - feat/cn-fund-limit-detail
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cn-fund-limit-detail
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply_cn_brand_and_022523.py
      - run: npm ci
      - run: npm run check:refactor
      - run: npm run build:app
        env:
          VITE_MARKETS_API_BASE: https://cn.freebacktrack.tech:5000/api/market-collector
      - name: Commit generated fixes
        run: |
          if git diff --quiet -- src/components/brand-preview-bar.css src/app/marketsWatchlistStorage.js src/app/nasdaqCatalog.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/brand-preview-bar.css src/app/marketsWatchlistStorage.js src/app/nasdaqCatalog.js
          git commit -m "fix: align CN brand left and correct fund 022523"
          git push origin HEAD:feat/cn-fund-limit-detail
