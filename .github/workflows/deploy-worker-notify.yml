name: Deploy notify worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run notify ownership regression tests
        run: node --test test/notifyAccountOwnership.test.mjs test/notifySettingsRoute.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config workers/notify/wrangler.toml
