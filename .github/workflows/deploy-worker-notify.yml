name: Deploy notify worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cn-notify-account-scoped-config
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply account-scoped notification config patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/account-notify.patch.gz.b64.part00 .tmp/account-notify.patch.gz.b64.part01 \
            | base64 -d \
            | gzip -d > /tmp/account-notify.patch
          echo '2d36a28bc887d470838c3102b7d67e467da5fa9ab1e5c4947a35a06a3083f8e6  /tmp/account-notify.patch' | sha256sum -c -
          git apply --check /tmp/account-notify.patch
          git apply /tmp/account-notify.patch
          git diff --check

      - name: Run account and notification regression tests
        run: >-
          node --test
          test/notifyAccountOwnership.test.mjs
          test/notifySettingsRoute.test.mjs
          test/notifyStatusSplit.test.mjs
          test/notifyWsClient.test.mjs
          test/switchStrategyConfigSync.test.mjs
          test/emailNotification.test.mjs
          test/notifyDeliveryTargetChannels.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Lint changed frontend files
        run: npx eslint src/app/notifySync.js src/app/switchStrategySync.js src/app/notifyWsClient.js --quiet

      - name: Build frontend
        run: npm run build

      - name: Validate notify Worker bundle
        run: npx wrangler deploy --dry-run --config workers/notify/wrangler.toml --outdir /tmp/notify-worker

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/notifySync.js \
            src/app/switchStrategySync.js \
            src/app/notifyWsClient.js \
            workers/notify/src/clientSettings.js \
            workers/notify/src/notifyAccountAuth.js \
            workers/notify/src/webWsRoutes.js \
            test/notifyAccountOwnership.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: scope all notification config to account'
          git push origin HEAD:fix/cn-notify-account-scoped-config
