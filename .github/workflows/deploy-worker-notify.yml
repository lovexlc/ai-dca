name: Deploy notify worker

on:
  push:
    branches:
      - main
      - cn
    paths:
      - 'workers/notify/**'
      - '.github/workflows/deploy-worker-notify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-notify-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy notify worker
        run: npx wrangler deploy --config workers/notify/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
