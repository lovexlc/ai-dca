name: Deploy notify worker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore current CN baseline and apply minimal fix
        run: |
          set -euo pipefail
          git fetch origin cn
          git checkout origin/cn -- workers/notify/src/notifyClientRoutes.js test/notifyAccountOwnership.test.mjs .github/workflows/deploy-worker-notify.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('workers/notify/src/notifyClientRoutes.js')
          text = source.read_text()
          old = """function sameVerifiedOwner(record, auth) {
            if (!auth?.ownerUserId) return false;
            if (record?.ownerUserId) return record.ownerUserId === auth.ownerUserId;
            return Boolean(auth.accountUsername && record?.accountUsername === auth.accountUsername);
          }
          """
          new = """function sameVerifiedOwner(record, auth) {
            if (!auth?.ownerUserId) return false;
            if (record?.ownerUserId === auth.ownerUserId) return true;

            const currentUsername = String(auth.accountUsername || '').trim().toLowerCase();
            const recordUsername = String(record?.accountUsername || '').trim().toLowerCase();
            return Boolean(currentUsername && recordUsername === currentUsername);
          }
          """
          if old not in text:
              raise SystemExit('sameVerifiedOwner baseline changed')
          source.write_text(text.replace(old, new, 1))

          test_file = Path('test/notifyAccountOwnership.test.mjs')
          tests = test_file.read_text()
          anchor = "test('Bark owned by another account requires explicit verified rebind', () => {\n"
          case = """test('same authenticated username with stale ownerUserId is treated as same channel owner', () => {
            const settings = {
              clients: {
                'account:usr_old': {
                  clientId: 'account:usr_old',
                  ownerUserId: 'usr_old',
                  accountUsername: 'lovexl',
                  serverChan3: { uid: '18912', sendKey: 'same-send-key' }
                },
                'account:usr_current': {
                  clientId: 'account:usr_current',
                  ownerUserId: 'usr_current',
                  accountUsername: 'lovexl'
                }
              }
            };

            const next = prepareUniqueChannelSettings(
              settings,
              'account:usr_current',
              { ownerUserId: 'usr_current', accountUsername: 'lovexl' },
              '',
              { uid: '18912', sendKey: 'same-send-key' }
            );

            assert.equal(next.clients['account:usr_old'].serverChan3.uid, '');
            assert.equal(next.clients['account:usr_old'].serverChan3.sendKey, '');
          });

          """
          if anchor not in tests:
              raise SystemExit('test anchor changed')
          test_file.write_text(tests.replace(anchor, case + anchor, 1))
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run ownership regression tests
        run: node --test test/notifyAccountOwnership.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config workers/notify/wrangler.toml

      - name: Commit clean fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/notify/src/notifyClientRoutes.js test/notifyAccountOwnership.test.mjs .github/workflows/deploy-worker-notify.yml
          git commit -m 'fix(notify): recognize same account after userId migration'
          git push origin HEAD:fix/cn-notify-same-account-channel-owner
