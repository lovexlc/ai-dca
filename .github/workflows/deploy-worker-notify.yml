name: Validate current CN notify rebind

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run notification regressions
        run: >-
          node --test
          test/notifyAccountOwnership.test.mjs
          test/emailNotification.test.mjs
          test/notifySettingsRoute.test.mjs
          test/notifyStatusSplit.test.mjs
          test/notifyWsClient.test.mjs
          test/notifyDeliveryTargetChannels.test.mjs
          test/switchStrategyConfigSync.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Lint rebind frontend files
        run: npx eslint src/app/notifySync.js src/pages/NotifyExperience.jsx src/pages/notify/useNotifyEmailChannel.js src/pages/notify/notificationRebind.js --quiet

      - name: Build frontend
        run: npm run build

      - name: Validate notify Worker bundle
        run: npx wrangler deploy --config workers/notify/wrangler.toml --dry-run
