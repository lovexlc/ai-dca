name: Validate notify verified rebind

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/cn-notify-verified-rebind
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply verified rebind patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/notify-rebind-v2.patch.gz.hex.part00 .tmp/notify-rebind-v2.patch.gz.hex.part01 \
            | xxd -r -p \
            | gzip -d > /tmp/notify-rebind.patch
          echo 'c7e76c234bbf224cda00f28fa1527d94abaede238f617e1acbc1867dfcc680c5  /tmp/notify-rebind.patch' | sha256sum -c -
          git apply --check /tmp/notify-rebind.patch
          git apply /tmp/notify-rebind.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/NotifyExperience.jsx')
          text = path.read_text()
          text = text.replace(
              "      const saved = await saveNotificationChannelWithRebind(\n        saveNotifySettings, { barkDeviceKey: parsedBarkKey }, 'bark', setNotifyMessage\n      );",
              "      const saved = await saveNotificationChannelWithRebind(saveNotifySettings, { barkDeviceKey: parsedBarkKey }, 'bark', setNotifyMessage);"
          )
          path.write_text(text)
          PY
          git diff --check

      - name: Run notification regressions
        run: node --test test/notify*.test.mjs test/emailNotification.test.mjs test/serverChan3Markdown.test.mjs test/switchStrategyConfigSync.test.mjs

      - name: Check refactor guard
        run: npm run check:refactor

      - name: Lint changed frontend files
        run: npx eslint src/app/notifySync.js src/pages/NotifyExperience.jsx src/pages/notify/useNotifyEmailChannel.js src/pages/notify/notificationRebind.js --quiet

      - name: Build frontend
        run: npm run build

      - name: Validate notify Worker bundle
        run: npx wrangler deploy --dry-run --config workers/notify/wrangler.toml

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/notify/src/notifyClientRoutes.js workers/notify/src/emailRoutes.js workers/notify/src/index.js src/app/notifySync.js src/pages/NotifyExperience.jsx src/pages/notify/useNotifyEmailChannel.js src/pages/notify/notificationRebind.js test/notifyAccountOwnership.test.mjs test/emailNotification.test.mjs
          git commit -m 'fix: allow verified notification channel rebind'
          git push origin HEAD:fix/cn-notify-verified-rebind
