name: Deploy notify worker

on:
  push:
    branches: [cn]
    paths:
      - 'workers/notify/**'
      - '.github/workflows/deploy-worker-notify.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy-worker-notify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check NAV access boundaries
        run: node scripts/check_nav_access.mjs
      - name: Check notify worker syntax
        run: |
          node --check workers/notify/src/accountEntry.js
          node --check workers/notify/src/accountSettingsRoute.js
          node --check workers/notify/src/accountChannelDeleteRoute.js
          node --check workers/notify/src/accountReadRoutes.js
          node --check workers/notify/src/accountRuleRoutes.js
          node --check workers/notify/src/accountEmailRoutes.js
          node --check workers/notify/src/accountWebWsRoutes.js
          node --check workers/notify/src/accountDeliveryRoute.js
          node --check workers/notify/src/deferredAccountRoutes.js
          node --check workers/notify/src/deliveryEngine.js
          node --check workers/notify/src/deliverySettlement.js
          node --check workers/notify/src/switchMarketCollector.js
          node --check workers/notify/src/switchDryRun.js
          node --check workers/notify/src/notifyReliabilityStorage.js
          node --check workers/notify/src/switchDecoupledPipeline.js
          node --check workers/notify/src/notifyAccountAuth.js
          node --check workers/notify/src/ack.js
      - name: Test notify reliability state machine
        run: node --test workers/notify/test/reliability.test.mjs
      - name: Ensure notify job queue exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: queues create ai-dca-notify-jobs
      - name: Ensure notify dead letter queue exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: queues create ai-dca-notify-dlq
      - name: Deploy notify worker via Wrangler
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/notify/wrangler.toml
      - name: Print deployment summary
        if: always()
        run: |
          echo "### notify worker deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
