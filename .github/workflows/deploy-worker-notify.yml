name: Deploy notify worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest cn-based branch
        uses: actions/checkout@v4
        with:
          ref: feature/cn-email-notify-rebase
          fetch-depth: 0

      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin feature/cn-email-notify:refs/remotes/origin/feature/cn-email-notify
          git config user.name 'merge-diagnostic'
          git config user.email 'merge-diagnostic@example.invalid'
          git merge --no-commit --no-ff origin/feature/cn-email-notify || true
          echo '=== CONFLICT FILES ==='
          git diff --name-only --diff-filter=U
          echo '=== STATUS ==='
          git status --short
          test -n "$(git diff --name-only --diff-filter=U)"
