name: Deploy notify worker

on:
  push:
    branches:
      - main
      - cn
    paths:
      - 'workers/notify/**'
      - '.github/workflows/deploy-worker-notify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-notify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check NAV access boundaries
        run: node scripts/check_nav_access.mjs

      - name: Deploy notify worker via Wrangler
        id: wrangler_deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: \u0024{{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: \u0024{{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: deploy --config workers/notify/wrangler.toml

      - name: Print deployment summary
        if: always()
        run: |
          echo "### notify worker deploy" >> "\u0024GITHUB_STEP_SUMMARY"
          echo "Commit: \u0024GITHUB_SHA" >> "\u0024GITHUB_STEP_SUMMARY"
          echo "Workflow: \u0024GITHUB_WORKFLOW" >> "\u0024GITHUB_STEP_SUMMARY"
