[unix_http_server]
file=/var/run/market-collector-supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/market-collector-supervisord.log
pidfile=/var/run/market-collector-supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/market-collector-supervisor.sock

[program:market-collector]
directory=/root/ai-dca
command=/root/ai-dca/services/market-collector/.venv/bin/python -m market_collector --root /root/ai-dca/services/market-collector --config /root/ai-dca/services/market-collector/config.json
environment=PYTHONPATH="/root/ai-dca/services/market-collector",PYTHONDONTWRITEBYTECODE="1"
user=root
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/market-collector.log
stderr_logfile=/var/log/supervisor/market-collector.err.log

[program:market-collector-api]
directory=/root/ai-dca
command=/root/ai-dca/services/market-collector/.venv/bin/python -m market_collector.http_server --host 0.0.0.0 --port 18080 --data-dir /root/ai-dca/services/market-collector/data/shadow
environment=PYTHONPATH="/root/ai-dca/services/market-collector",PYTHONDONTWRITEBYTECODE="1"
user=root
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/market-collector-api.log
stderr_logfile=/var/log/supervisor/market-collector-api.err.log
